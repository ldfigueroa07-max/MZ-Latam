// ─── Render one module accordion row ───
function vModRow(m) {
    const on      = modOn[m.id] !== false;
    const exp     = modExpand[m.id];
    const items   = sesItems[m.id] || [];
    const m2val   = parseFloat(document.getElementById('e-m2')?.value) || 0;
    const total   = modTotal(m.id, m2val);
    const mode    = modMode(m.id);
    const isItems = items.length > 0;

    return `
    <div class="mod-row ${on?'on':'off'}" id="mr-${m.id}" style="border-left:3px solid ${modColor(m.id).border}">
        <!-- header -->
        <div class="mod-hd" onclick="toggleExpand('${m.id}')">
            <div class="mod-toggle ${on?'on':''}" onclick="toggleMod('${m.id}');event.stopPropagation()"></div>
            ${modBadge(m.id)}
            <span class="mod-name">${m.name}</span>
            ${isItems
                ? `<span class="mod-badge items-mode">📋 ${items.length} ítem${items.length!==1?'s':''}</span>`
                : `<span class="mod-badge m2-mode">m² × ${fPri(m.costUSD)}</span>`
            }
            <span class="mod-subtotal" id="ms-${m.id}">${on && m2val > 0 || isItems ? fPri(total) : '—'}</span>
            <button onclick="removeRubroFromSes('${m.id}');event.stopPropagation()"
                title="Quitar este rubro del presupuesto"
                style="background:none;border:none;color:#ddd;cursor:pointer;padding:3px 6px;font-size:15px;flex-shrink:0;line-height:1;border-radius:4px"
                onmouseover="this.style.color='#ef4444';this.style.background='#fff1f2'"
                onmouseout="this.style.color='#ddd';this.style.background='none'">✕</button>
            <span class="mod-arrow ${exp?'open':''}">▼</span>
        </div>

        <!-- body -->
        <div class="mod-body ${exp?'open':''}" id="mb-${m.id}">
            <div class="items-table-wrap">
                <table class="items-table">
                    <thead>
                        <tr>
                            <th style="width:30%">Descripción</th>
                            <th style="width:8%">Cant.</th>
                            <th style="width:9%">Un.</th>
                            <th style="width:12%">P.Mat ${priLbl()}</th>
                            <th style="width:12%">P.MO ${priLbl()}</th>
                            <th style="width:16%">Subtotal</th>
                            <th style="width:13%"></th>
                        </tr>
                    </thead>
                    <tbody id="it-${m.id}">
                        ${items.length > 0
                            ? items.map(i => vItemRow(m.id, i)).join('')
                            : `<tr id="ph-${m.id}"><td colspan="6" class="items-placeholder">
                                Sin ítems cargados — usá "Agregar ítem" para ingresar el despiece,<br>o importá desde un Excel / CSV de Revit adjuntando el archivo abajo.
                               </td></tr>`
                        }
                    </tbody>
                </table>
            </div>
            <div class="mod-footer">
                <div style="display:flex;gap:8px;flex-wrap:wrap">
                    <button class="btn-add-item" onclick="addItem('${m.id}')">＋ Agregar ítem</button>
                    ${master ? `<button class="btn-add-item" onclick="openMaestroModal('${m.id}')"
                        style="border-color:#6366f1;color:#6366f1"
                        onmouseover="this.style.background='#6366f1';this.style.color='#fff'"
                        onmouseout="this.style.background='#fff';this.style.color='#6366f1'">📋 Buscar en maestro</button>` : ''}
                </div>
                <div>
                    <span class="mod-total-line" id="mf-${m.id}">${isItems ? fPri(total) : `Estimado m²: ${fPri(total)}`}</span>
                    <span class="mod-total-ars" id="mf-ars-${m.id}">${isItems || m2val>0 ? fSec(total, cfg.usdArs) : ''}</span>
                </div>
            </div>

            <!-- ── PROVEEDORES DEL MÓDULO ── -->
            <div class="mod-prov-section">
                <div class="mod-prov-label">
                    <span>◈ Proveedores del módulo</span>
                    <button class="btn-add-item" onclick="showAddModProvModal('${m.id}')">＋ Agregar proveedor</button>
                </div>
                <div id="mprov-${m.id}">${vModProvTable(m.id)}</div>
            </div>

            <!-- ── NOTAS DEL MÓDULO ── -->
            <div class="mod-notes-section" style="position:relative">
                <div class="mod-notes-label">📝 Notas y responsables del módulo</div>
                <textarea class="mod-notes-ta" id="mn-${m.id}"
                    placeholder="Anotaciones, referencias… escribí @ para etiquetar a alguien"
                    oninput="onModNoteInput('${m.id}',this)">${esc(sesNotes[m.id]||'')}</textarea>
                <div id="mn-sugg-${m.id}" class="mention-sugg" style="display:none;position:absolute;left:0;right:0;top:100%;z-index:100;background:#fff;border:1.5px solid #d0d0d0;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.1);overflow:hidden"></div>
            </div>

            <!-- ── ARCHIVOS DEL MÓDULO ── -->
            <div class="mod-files-section" id="mfs-${m.id}">
                <div class="mod-files-label">
                    <span>📎 Archivos del módulo</span>
                    <button class="btn-add-item" onclick="document.getElementById('mf-in-${m.id}').click()">＋ Adjuntar archivo</button>
                </div>
                <input type="file" id="mf-in-${m.id}" multiple style="display:none"
                    accept=".jpg,.jpeg,.png,.gif,.webp,.pdf,.txt,.csv,.xlsx,.xls"
                    onchange="addModFiles('${m.id}', this)">
                <div id="mf-grid-${m.id}" class="mod-file-grid">
                    ${vModFileGrid(m.id)}
                </div>
            </div>
        </div>
    </div>`;
}

// ─── Render one item row ───
function vItemRow(modId, item) {
    const pm   = parseFloat(item.priceMat ?? item.priceUSD ?? 0) || 0;
    const pmo  = parseFloat(item.priceMO) || 0;
    const sub  = (parseFloat(item.qty)||0) * (pm + pmo);
    const opts = UNITS.map(u => `<option value="${u}" ${u===item.unit?'selected':''}>${u}</option>`).join('');
    return `
    <tr id="ir-${item.id}">
        <td>
            <input class="ii desc" type="text" value="${esc(item.desc)}" placeholder="Ej: Tabique durlock doble placa"
                oninput="updItem('${modId}','${item.id}','desc',this.value)">
            ${item.fromMaster ? `<div style="font-size:10px;color:#6366f1;font-weight:600;margin-top:2px;padding-left:2px">📋 ${esc(item.fromMaster)}</div>` : ''}
        </td>
        <td><input class="ii num" type="number" min="0" step="0.01" value="${item.qty||''}" placeholder="0"
            oninput="updItem('${modId}','${item.id}','qty',this.value)"></td>
        <td><select class="ii-unit" onchange="updItem('${modId}','${item.id}','unit',this.value)">${opts}</select></td>
        <td><input class="ii price" type="number" min="0" step="0.01" value="${pm||''}" placeholder="0.00"
            oninput="updItem('${modId}','${item.id}','priceMat',this.value)" title="Precio materiales"></td>
        <td><input class="ii price" type="number" min="0" step="0.01" value="${pmo||''}" placeholder="0.00"
            oninput="updItem('${modId}','${item.id}','priceMO',this.value)" title="Mano de obra"></td>
        <td class="item-sub ${sub===0?'zero':''}" id="is-${item.id}">${sub>0 ? fPri(sub) : '—'}</td>
        <td style="text-align:center">
            <button class="btn btn-ghost btn-sm" title="Eliminar fila" onclick="rmItem('${modId}','${item.id}')">✕</button>
        </td>
    </tr>`;
}

// ─── Toggle module ON/OFF ───
function toggleMod(id) {
    modOn[id] = !modOn[id];
    refreshModRow(id);
    calcEst();
}

// ─── Toggle expand ───
function toggleExpand(id) {
    modExpand[id] = !modExpand[id];
    const body  = document.getElementById(`mb-${id}`);
    const arrow = document.querySelector(`#mr-${id} .mod-arrow`);
    const row   = document.getElementById(`mr-${id}`);
    if (body)  body.classList.toggle('open', modExpand[id]);
    if (arrow) arrow.classList.toggle('open', modExpand[id]);
}

// ─── Add item to module ───
function addItem(modId) {
    modExpand[modId] = true;
    const body = document.getElementById(`mb-${modId}`);
    if (body) body.classList.add('open');
    const arrow = document.querySelector(`#mr-${modId} .mod-arrow`);
    if (arrow) arrow.classList.add('open');

    const item = { id: uid(), desc: '', qty: 1, unit: 'm²', priceMat: 0, priceMO: 0 };
    sesItems[modId] = sesItems[modId] || [];
    sesItems[modId].push(item);

    const tbody = document.getElementById(`it-${modId}`);
    const ph    = document.getElementById(`ph-${modId}`);
    if (ph) ph.remove();
    if (tbody) tbody.insertAdjacentHTML('beforeend', vItemRow(modId, item));

    refreshModRow(modId);
    calcEst();

    // Focus the new row's description input
    const newRow = document.getElementById(`ir-${item.id}`);
    if (newRow) newRow.querySelector('.ii.desc')?.focus();
}

// ─── Remove item ───
function rmItem(modId, itemId) {
    sesItems[modId] = (sesItems[modId]||[]).filter(i => i.id !== itemId);
    const row = document.getElementById(`ir-${itemId}`);
    if (row) row.remove();

    // If no items left, show placeholder
    if (sesItems[modId].length === 0) {
        const tbody = document.getElementById(`it-${modId}`);
        const m = cfg.modules.find(x => x.id === modId);
        if (tbody) tbody.innerHTML = `<tr id="ph-${modId}"><td colspan="7" class="items-placeholder">
            Sin ítems — el módulo usa tarifa base (${fUSD(m?.costUSD||0)}/m²).
        </td></tr>`;
    }

    refreshModRow(modId);
    calcEst();
}

// ─── Module file: add files handler ───
async function addModFiles(modId, input) {
    const files = Array.from(input.files);
    if (!files.length) return;
    input.value = '';

    const btn = document.querySelector(`#mfs-${modId} .mod-file-add`);
    if (btn) btn.textContent = 'Procesando…';

    let parsedCount = 0;

    for (const file of files) {
        if (file.size > MAX_FILE_B) {
            toast(`⚠️ "${file.name}" supera 3 MB — no se pudo guardar`);
            continue;
        }
        const ext   = file.name.split('.').pop().toLowerCase();
        const isImg = IMG_EXT.includes(ext);
        const isPdf = PDF_EXT.includes(ext);
        const isTxt = TXT_EXT.includes(ext);
        const isXls = XLS_EXT.includes(ext);
        const id    = uid();

        let dataUrl = null;
        if (isImg) {
            dataUrl = await compressImage(file);
        } else if (isPdf) {
            dataUrl = await readAsDataURL(file);
        } else if (isTxt) {
            // Parse TXT/CSV → auto-populate items + notes
            const { rows, rawText } = await parseTxtFile(file);
            if (rows.length) {
                importParsedRows(modId, rows);
                parsedCount += rows.length;
            }
            appendModNote(modId, file.name, rawText);
            dataUrl = null; // store name only, no binary needed
        } else if (isXls) {
            // Parse Excel → auto-populate items + notes
            const { rows, rawText } = await parseXlsFile(file);
            if (rows.length) {
                // If the file has a Rubro column (plantilla dinámica), route items to matching modules automatically.
                // Otherwise fall back to the selected module.
                const hasRubro = rows.some(r => r.rubro && r.rubro.trim());
                if (hasRubro) {
                    // Group rows by rubro name
                    const byRubro = {};
                    rows.forEach(r => {
                        const key = r.rubro.trim().toLowerCase();
                        if (!byRubro[key]) byRubro[key] = [];
                        byRubro[key].push(r);
                    });
                    // Match each rubro key to an active module in this session
                    let matched = 0;
                    (sesModules || []).forEach(m => {
                        const mKey = (m.nombre || '').trim().toLowerCase();
                        if (byRubro[mKey]) {
                            importParsedRows(m.id, byRubro[mKey]);
                            parsedCount += byRubro[mKey].length;
                            matched += byRubro[mKey].length;
                        }
                    });
                    // Any rows whose rubro didn't match a module → fall to the selected module
                    const unmatched = rows.filter(r => {
                        const key = r.rubro.trim().toLowerCase();
                        return !(sesModules || []).some(m => (m.nombre||'').trim().toLowerCase() === key);
                    });
                    if (unmatched.length) {
                        importParsedRows(modId, unmatched);
                        parsedCount += unmatched.length;
                    }
                    if (matched > 0) toast(`✅ ${matched} ítems asignados automáticamente por rubro`);
                } else {
                    importParsedRows(modId, rows);
                    parsedCount += rows.length;
                }
            }
            appendModNote(modId, file.name, rawText);
            dataUrl = null;
        }

        sesFiles[modId] = sesFiles[modId] || [];
        sesFiles[modId].push({ id, name: file.name, size: file.size, type: file.type, dataUrl, isImg, isPdf, isTxt, isXls });
    }

    // Refresh grid
    const grid = document.getElementById(`mf-grid-${modId}`);
    if (grid) grid.innerHTML = vModFileGrid(modId);
    if (btn) btn.textContent = '+ Agregar archivo';

    if (parsedCount > 0) {
        toast(`✅ ${parsedCount} ítem(s) importados automáticamente al módulo`);
    } else {
        toast(`✅ ${files.length} archivo(s) adjuntado(s) al módulo`);
    }
}

// ─── Parse TXT / CSV → { rows, rawText } ───
// Expected column order: Descripción | Cantidad | Unidad | Precio USD
// Separators: tab, semicolon, pipe or comma. Lines starting with # are skipped.
async function parseTxtFile(file) {
    const rawText = await file.text();
    const lines   = rawText.split(/\r?\n/).map(l => l.trim()).filter(l => l && !l.startsWith('#'));
    const rows    = [];
    for (const line of lines) {
        const sep  = line.includes('\t') ? '\t'
                   : line.includes(';')  ? ';'
                   : line.includes('|')  ? '|'
                   : ',';
        const cols = line.split(sep).map(c => c.trim());
        if (!cols[0]) continue;
        const desc     = cols[0];
        const qty      = parseFloat((cols[1]||'').replace(',','.')) || 1;
        const rawUnitTxt = (cols[2]||'').trim().toLowerCase();
        const normUnitTxt = rawUnitTxt === 'm2' || rawUnitTxt === 'sqm' ? 'm²'
                          : rawUnitTxt === 'm3' || rawUnitTxt === 'cbm' ? 'm³'
                          : rawUnitTxt === 'ml' || rawUnitTxt === 'lm'  ? 'ml'
                          : rawUnitTxt === 'u'  || rawUnitTxt === 'und' || rawUnitTxt === 'unid' ? 'un'
                          : rawUnitTxt === 'global' ? 'gl'
                          : rawUnitTxt === 'hr' || rawUnitTxt === 'h' ? 'hs'
                          : rawUnitTxt;
        const unit     = UNITS.includes(normUnitTxt) ? normUnitTxt : 'un';
        const priceMat = parseFloat((cols[3]||cols[1]||'').replace(',','.').replace(/[^0-9.]/g,'')) || 0;
        const priceMO  = parseFloat((cols[4]||'').replace(',','.').replace(/[^0-9.]/g,'')) || 0;
        rows.push({ desc, qty, unit, priceMat, priceMO });
    }
    return { rows, rawText };
}

// ─── Parse Excel (.xlsx/.xls) → { rows, rawText } using SheetJS (lazy CDN load) ───
async function parseXlsFile(file) {
    if (!window.XLSX) {
        await new Promise((res, rej) => {
            const s = document.createElement('script');
            s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
            s.onload = res; s.onerror = rej;
            document.head.appendChild(s);
        });
    }
    const buf  = await file.arrayBuffer();
    const wb   = window.XLSX.read(buf, { type: 'array' });
    const ws   = wb.Sheets[wb.SheetNames[0]];
    const data = window.XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
    const rows = [];

    // Build human-readable rawText (tab-separated table)
    const rawText = data.map(row => row.map(c => String(c)).join('\t')).join('\n');

    // Auto-detect header row and column positions
    let startIdx = 0;
    let colRubro = -1, colCod = -1, colDesc = 0, colQty = 1, colUnit = 2, colMat = 3, colMO = 4, colComent = -1;

    for (let i = 0; i < Math.min(data.length, 5); i++) {
        const row = data[i].map(c => String(c).toLowerCase().trim());
        const hasHeader = row.some(c => ['desc','concepto','detalle','nombre','rubro','descripcion','descripción'].some(k => c.includes(k)));
        if (hasHeader) {
            startIdx = i + 1;
            // Map columns by header name so any order works.
            // Note: "rubro" is checked FIRST (before desc) to avoid it being captured as a description column.
            row.forEach((c, idx) => {
                if (['rubro','modulo','módulo','categoria','categoría'].some(k => c === k || c.startsWith(k)))           colRubro  = idx;
                else if (['cod','codigo','código','item','#'].some(k => c.includes(k)))                                  colCod    = idx;
                else if (['desc','concepto','detalle','nombre'].some(k => c.includes(k)))                                colDesc   = idx;
                else if (['cant','qty','cantidad'].some(k => c.includes(k)))                                             colQty    = idx;
                else if (['unid','unit','und'].some(k => c.includes(k)))                                                 colUnit   = idx;
                else if (['pu.mat','p.mat','mat','precio mat','precio unit'].some(k => c.includes(k)))                   colMat    = idx;
                else if (['pmo','p.mo','mano','mo'].some(k => c.includes(k)))                                            colMO     = idx;
                else if (['coment','observ','nota','note'].some(k => c.includes(k)))                                     colComent = idx;
            });
            break;
        }
    }

    const normalizeUnit = rawUnit => {
        const u = rawUnit.trim().toLowerCase();
        if (u === 'm2' || u === 'sqm' || u === 'm 2') return 'm²';
        if (u === 'm3' || u === 'cbm' || u === 'm 3') return 'm³';
        if (u === 'ml' || u === 'lm'  || u === 'm')   return 'ml';
        if (u === 'un' || u === 'u'   || u === 'und'  || u === 'unid') return 'un';
        if (u === 'gl' || u === 'global')              return 'gl';
        if (u === 'hs' || u === 'hr'  || u === 'h')   return 'hs';
        if (u === 'kg')  return 'kg';
        if (u === 'lote') return 'lote';
        return u;
    };

    for (let i = startIdx; i < data.length; i++) {
        const row = data[i];
        if (!row || !row.length) continue;
        const desc = String(row[colDesc] || '').trim();
        if (!desc) continue;
        const cod      = colCod >= 0 ? String(row[colCod] || '').trim() : '';
        const qty      = parseFloat(String(row[colQty]||'1').replace(',','.')) || 1;
        const normUnit = normalizeUnit(String(row[colUnit]||''));
        const unit     = UNITS.includes(normUnit) ? normUnit : 'un';
        const priceMat  = parseFloat(String(row[colMat]||'0').replace(',','.').replace(/[^0-9.]/g,'')) || 0;
        const priceMO   = parseFloat(String(row[colMO] ||'0').replace(',','.').replace(/[^0-9.]/g,'')) || 0;
        const comentario = colComent >= 0 ? String(row[colComent] || '').trim() : '';
        const rubro      = colRubro  >= 0 ? String(row[colRubro]  || '').trim() : '';
        rows.push({ cod, desc, qty, unit, priceMat, priceMO, comentario, rubro });
    }
    return { rows, rawText };
}

// ─── Append imported text to module notes ───
function appendModNote(modId, fileName, text) {
    const header   = `── ${fileName} ──\n`;
    const existing = sesNotes[modId] || '';
    sesNotes[modId] = (existing ? existing + '\n\n' : '') + header + text.trim();

    const ta = document.getElementById(`mn-${modId}`);
    if (ta) {
        ta.value = sesNotes[modId];
        ta.classList.add('populated');
        // Auto-expand height to show content
        ta.style.height = 'auto';
        ta.style.height = Math.min(ta.scrollHeight, 280) + 'px';
    }
}

// ─── Import parsed rows into a module ───
function importParsedRows(modId, rows) {
    // Expand the module accordion
    modExpand[modId] = true;
    const body  = document.getElementById(`mb-${modId}`);
    const arrow = document.querySelector(`#mr-${modId} .mod-arrow`);
    if (body)  body.classList.add('open');
    if (arrow) arrow.classList.add('open');

    sesItems[modId] = sesItems[modId] || [];
    const tbody = document.getElementById(`it-${modId}`);
    const ph    = document.getElementById(`ph-${modId}`);
    if (ph) ph.remove();

    rows.forEach(r => {
        const item = { id: uid(), desc: r.desc, qty: r.qty, unit: r.unit, priceMat: r.priceMat??r.priceUSD??0, priceMO: r.priceMO??0 };
        sesItems[modId].push(item);
        if (tbody) tbody.insertAdjacentHTML('beforeend', vItemRow(modId, item));
    });

    refreshModRow(modId);
    calcEst();
}

// ─── Module file: remove ───
function rmModFile(modId, fileId) {
    sesFiles[modId] = (sesFiles[modId]||[]).filter(f => f.id !== fileId);
    const grid = document.getElementById(`mf-grid-${modId}`);
    if (grid) grid.innerHTML = vModFileGrid(modId);
}

// ─── Lightbox for images ───
function openLightbox(fileId, modId) {
    const f = (sesFiles[modId]||[]).find(x => x.id === fileId);
    if (!f || !f.dataUrl) return;
    openLightboxDirect(f.dataUrl, f.name);
}

function openLightboxDirect(dataUrl, name) {
    const lb = document.createElement('div');
    lb.className = 'lightbox';
    lb.innerHTML = `<span class="lb-close" onclick="this.parentElement.remove()">✕</span>
                    <img src="${dataUrl}" alt="${esc(name||'')}">`;
    lb.onclick = e => { if (e.target === lb) lb.remove(); };
    document.body.appendChild(lb);
}

// ─── Image compression via canvas ───
function compressImage(file) {
    return new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = e => {
            const img = new Image();
            img.onload = () => {
                let w = img.width, h = img.height;
                if (w > MAX_IMG_PX || h > MAX_IMG_PX) {
                    if (w >= h) { h = Math.round(h * MAX_IMG_PX / w); w = MAX_IMG_PX; }
                    else        { w = Math.round(w * MAX_IMG_PX / h); h = MAX_IMG_PX; }
                }
                const c = document.createElement('canvas');
                c.width = w; c.height = h;
                c.getContext('2d').drawImage(img, 0, 0, w, h);
                resolve(c.toDataURL('image/jpeg', 0.78));
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    });
}

// ─── Generic file to base64 ───
function readAsDataURL(file) {
    return new Promise(resolve => {
        const r = new FileReader();
        r.onload = e => resolve(e.target.result);
        r.readAsDataURL(file);
    });
}

// ─── Update item field ───
function updItem(modId, itemId, field, value) {
    const items = sesItems[modId] || [];
    const item  = items.find(i => i.id === itemId);
    if (!item) return;
    item[field] = value;

    // Update subtotal cell live
    const sub = (parseFloat(item.qty)||0) * ((parseFloat(item.priceMat??item.priceUSD??0)||0)+(parseFloat(item.priceMO)||0));
    const subEl  = document.getElementById(`is-${itemId}`);
    if (subEl) {
        subEl.textContent = sub > 0 ? fPri(sub) : '—';
        subEl.className   = `item-sub ${sub===0?'zero':''}`;
    }

    refreshModRow(modId);
    calcEst();
}

// ─── Refresh module row header (total + badge) without full re-render ───
function refreshModRow(modId) {
    const m2val  = parseFloat(document.getElementById('e-m2')?.value) || 0;
    const on     = modOn[modId] !== false;
    const items  = sesItems[modId] || [];
    const isItems = items.length > 0;
    const total  = modTotal(modId, m2val);
    const m      = cfg.modules.find(x => x.id === modId);
    const row    = document.getElementById(`mr-${modId}`);

    if (row) {
        row.classList.toggle('on',  on);
        row.classList.toggle('off', !on);
    }

    // toggle switch class
    const tog = document.querySelector(`#mr-${modId} .mod-toggle`);
    if (tog) tog.classList.toggle('on', on);

    // subtotal in header
    const st = document.getElementById(`ms-${modId}`);
    if (st) st.textContent = (on && (m2val>0 || isItems)) ? fPri(total) : '—';

    // badge
    const badge = document.querySelector(`#mr-${modId} .mod-badge`);
    if (badge) {
        badge.className = `mod-badge ${isItems?'items-mode':'m2-mode'}`;
        badge.textContent = isItems
            ? `📋 ${items.length} ítem${items.length!==1?'s':''}`
            : `m² × ${fPri(m?.costUSD||0)}`;
    }

    // footer total
    const ft    = document.getElementById(`mf-${modId}`);
    const ftArs = document.getElementById(`mf-ars-${modId}`);
    if (ft) ft.textContent = on ? (isItems ? fPri(total) : `Estimado m²: ${fPri(total)}`) : '—';
    if (ftArs) ftArs.textContent = (on && (m2val>0 || isItems)) ? fSec(total, getTCForm()) : '';
}

// ─── Recalculate grand total ───
function getTCForm() {
    return parseFloat(document.getElementById('e-tc')?.value) || cfg.usdArs;
}
function getMGForm() {
    const raw = (document.getElementById('e-margen')?.value || '').replace(',', '.');
    return parseFloat(raw) || cfg.margen || 10;
}

function onCurrencyChange() {
    const sel = document.querySelector('input[name="e-moneda"]:checked');
    sesCurrency = sel ? sel.value : 'ARS';
    const isARS = sesCurrency === 'ARS';

    // Update toggle visual
    const uLbl = document.getElementById('cur-usd-lbl');
    const aLbl = document.getElementById('cur-ars-lbl');
    if (uLbl) {
        uLbl.style.background = isARS ? '#fff' : '#111';
        uLbl.style.color      = isARS ? '#555' : '#fff';
        uLbl.style.border     = isARS ? '2px solid #d0d0d0' : '2px solid #111';
    }
    if (aLbl) {
        aLbl.style.background = isARS ? '#111' : '#fff';
        aLbl.style.color      = isARS ? '#fff' : '#555';
        aLbl.style.border     = isARS ? '2px solid #111' : '2px solid #d0d0d0';
    }

    // Update column headers in all open module tables
    document.querySelectorAll('.items-table thead th:nth-child(4)').forEach(th => {
        th.textContent = 'Precio ' + priLbl();
    });

    calcEst();
}

function calcEst() {
    const m2val  = parseFloat(document.getElementById('e-m2')?.value) || 0;
    const mgVal  = getMGForm();
    const mg     = mgVal / 100;
    const tc     = getTCForm();
    const total  = grandTotal(m2val);

    // Refresh all module rows
    sesModules.forEach(m => refreshModRow(m.id));

    const usdEl  = document.getElementById('r-usd');
    const rngEl  = document.getElementById('r-rng-usd');
    const arsEl  = document.getElementById('r-ars');
    const arsREl = document.getElementById('r-rng-ars');
    const bkEl   = document.getElementById('bk-list');

    const hasData = total > 0;

    // Update labels and TC note dynamically
    const tcNote   = document.getElementById('r-tc-note');
    const priLblEl = document.getElementById('r-lbl-pri');
    const secLblEl = document.getElementById('r-lbl-sec');
    if (tcNote)   tcNote.textContent   = `TC: 1 USD = ARS ${fmt(tc)}`;
    if (priLblEl) priLblEl.textContent = isModeARS() ? 'Total en Pesos Argentinos' : 'Total Estimado';
    if (secLblEl) secLblEl.textContent = isModeARS() ? 'Equivalente en Dólares'    : 'En Pesos Argentinos';

    // Update MG preview next to field
    const mgPrev = document.getElementById('e-margen-preview');
    if (mgPrev && hasData) {
        const ganancia = total * mg;
        mgPrev.textContent = `+${fPri(ganancia)}`;
    } else if (mgPrev) {
        mgPrev.textContent = '';
    }

    if (hasData) {
        const hi = total * (1 + mg);
        // Número principal = precio al cliente (con MG)
        if (usdEl)  usdEl.textContent  = fPri(hi);
        if (rngEl)  rngEl.textContent  = `Costo base: ${fPri(total)} · MG ${mgVal}%`;
        if (arsEl)  arsEl.textContent  = fSec(hi, tc);
        if (arsREl) arsREl.textContent = `Base: ${fSec(total, tc)}`;
        if (bkEl)   bkEl.innerHTML     = bkHTML(m2val, total);
    } else {
        if (usdEl)  usdEl.textContent  = '—';
        if (rngEl)  rngEl.textContent  = 'Ingresá los datos del proyecto';
        if (arsEl)  arsEl.textContent  = '—';
        if (arsREl) arsREl.textContent = '';
        if (bkEl)   bkEl.innerHTML     = '<div style="color:#bbb;font-size:15px;text-align:center;padding:12px">Ingresá datos para ver el desglose</div>';
    }
}

function bkHTML(m2val, total) {
    const mgVal    = getMGForm();
    const mg       = mgVal / 100;
    const ganancia = total * mg;
    const clientTotal = total + ganancia;

    const rows = sesModules
        .filter(m => modOn[m.id] !== false)
        .map(m => {
            const v   = modTotal(m.id, m2val);
            const pct = total > 0 ? Math.round(v/total*100) : 0;
            return `<div class="bk-row">
                ${modBadge(m.id,'sm')}
                <div style="flex:1">
                    <div style="display:flex;justify-content:space-between;font-size:15px;margin-bottom:3px">
                        <span>${m.name}</span><span style="font-weight:600">${fPri(v)}</span>
                    </div>
                    <div class="bk-bar"><div class="bk-fill" style="width:${pct}%"></div></div>
                </div>
                <span style="font-size:14px;color:#aaa;width:28px;text-align:right">${pct}%</span>
            </div>`;
        }).join('');

    const mgRow = (total > 0 && mgVal > 0) ? `
        <div style="display:flex;align-items:center;gap:10px;padding:8px 4px 4px;border-top:1.5px dashed #d0d0d0;margin-top:6px">
            <span style="font-size:18px;flex-shrink:0">💰</span>
            <div style="flex:1">
                <div style="display:flex;justify-content:space-between;font-size:14px">
                    <span style="color:#6366f1;font-weight:600">Margen ganancia ${mgVal}%</span>
                    <span style="font-weight:700;color:#6366f1">+ ${fPri(ganancia)}</span>
                </div>
            </div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 4px 2px;font-size:15px;font-weight:700;border-top:2px solid #6366f1;margin-top:4px">
            <span style="color:#111">Total precio cliente</span>
            <span style="color:#6366f1">${fPri(clientTotal)}</span>
        </div>` : '';

    return rows + mgRow;
}

// ─── Prefill estimador when editing ───
function prefill() {
    const p = plist.find(x => x.id === editId);
    if (!p) return;
    const set = (id, v) => { const el = document.getElementById(id); if(el) el.value = v||''; };
    set('e-cli',      p.cliente);
    set('e-pro',      p.proyecto);
    set('e-ubic',     p.ubicacion);
    set('e-notas',    p.notas);
    set('e-m2',       p.metros);
    set('e-fil',      p.fil || '');
    set('e-diasobra', p.diasObra || '');
    set('e-margen',   p.margen !== undefined ? String(p.margen).replace('.', ',') : '');
    set('e-tc',       p.usdArs || cfg.usdArs);
    // Restore currency
    sesCurrency = p.moneda || 'ARS';
    const usdRadio = document.getElementById('e-moneda-usd');
    const arsRadio = document.getElementById('e-moneda-ars');
    if (usdRadio) usdRadio.checked = sesCurrency === 'USD';
    if (arsRadio) arsRadio.checked = sesCurrency === 'ARS';
    onCurrencyChange();
    const asgEl = document.getElementById('e-asignado');
    if (asgEl && p.assignedTo) asgEl.value = p.assignedTo;
    const tipoEl = document.getElementById('e-tipo');
    if (tipoEl) tipoEl.value = p.tipo || 'local';
    // Restore contacts
    const ct = p.contacts || {};
    set('e-cc-nom',   ct.comercial?.nom   || '');
    set('e-cc-email', ct.comercial?.email || '');
    set('e-cc-tel',   ct.comercial?.tel   || '');
    set('e-ca-nom',   ct.administracion?.nom   || '');
    set('e-ca-email', ct.administracion?.email || '');
    set('e-ca-tel',   ct.administracion?.tel   || '');
    set('e-cl-nom',   ct.legales?.nom   || '');
    set('e-cl-email', ct.legales?.email || '');
    set('e-cl-tel',   ct.legales?.tel   || '');
    // Restore logo
    restoreLogo(p.logo);

    // Restore module state
    if (p.modules) {
        // Rebuild sesModules from saved presupuesto modules
        sesModules = p.modules.map(pm => ({
            id:      pm.id,
            name:    pm.name || pm.id,
            emoji:   pm.emoji || '📦',
            costUSD: pm.costUSD || 0,
        }));
        p.modules.forEach(pm => {
            modOn[pm.id]    = pm.on !== false;
            sesItems[pm.id] = (pm.items  || []).map(i => ({ ...i, id: i.id || uid() }));
            sesFiles[pm.id] = (pm.files  || []).map(f => ({ ...f, id: f.id || uid() }));
            sesNotes[pm.id] = pm.notes   || '';
            sesProvs[pm.id] = (pm.proveedores || []).map(p => ({ ...p, id: p.id || uid() }));
        });
        // Re-render module list + picker
        const ml = document.getElementById('mod-list');
        if (ml) ml.innerHTML = sesModules.map(m => vModRow(m)).join('');
        _refreshPickerChips();
        // Restore populated styling on notes textareas
        sesModules.forEach(m => {
            if (sesNotes[m.id]) {
                const ta = document.getElementById(`mn-${m.id}`);
                if (ta) { ta.classList.add('populated'); ta.style.height = Math.min(ta.scrollHeight, 280) + 'px'; }
            }
        });
    }
    calcEst();
}

// ─── Logo upload ───
function handleLogoUpload(input) {
    const file = input.files[0];
    if (!file) return;
    const isImg = file.type.startsWith('image/');
    const reader = new FileReader();
    reader.onload = e => {
        sesLogo = { name: file.name, dataUrl: e.target.result, isImg };
        const wrap = document.getElementById('logo-preview-wrap');
        const img  = document.getElementById('logo-preview-img');
        const zone = document.getElementById('logo-drop-zone');
        if (isImg) {
            img.src = e.target.result;
            wrap.style.display = 'block';
            zone.style.display = 'none';
        } else {
            // PDF — show name badge instead
            wrap.style.display = 'none';
            zone.innerHTML = `📄 <strong>${esc(file.name)}</strong><br><span style="font-size:11px;color:#888">PDF cargado</span> <span onclick="clearLogo()" style="cursor:pointer;color:#dc2626;font-size:12px;margin-left:6px">✕ quitar</span>`;
        }
    };
    reader.readAsDataURL(file);
    input.value = '';
}
function clearLogo() {
    sesLogo = null;
    document.getElementById('logo-preview-wrap').style.display = 'none';
    document.getElementById('logo-drop-zone').style.display = 'block';
    document.getElementById('logo-drop-zone').innerHTML = `📎 Subir plano o logo<br><span style="font-size:11px;color:#aaa">PNG · JPG · PDF</span>`;
}
function restoreLogo(logo) {
    if (!logo) return;
    sesLogo = logo;
    const wrap = document.getElementById('logo-preview-wrap');
    const img  = document.getElementById('logo-preview-img');
    const zone = document.getElementById('logo-drop-zone');
    if (!wrap) return;
    if (logo.isImg) {
        img.src = logo.dataUrl;
        wrap.style.display = 'block';
        zone.style.display = 'none';
    } else {
        wrap.style.display = 'none';
        zone.innerHTML = `📄 <strong>${esc(logo.name)}</strong><br><span style="font-size:11px;color:#888">PDF cargado</span> <span onclick="clearLogo()" style="cursor:pointer;color:#dc2626;font-size:12px;margin-left:6px">✕ quitar</span>`;
    }
}

// ─── Save presupuesto ───
function guardar(status) {
    const cliente   = document.getElementById('e-cli')?.value?.trim();
    const proyecto  = document.getElementById('e-pro')?.value?.trim();
    const metros    = parseFloat(document.getElementById('e-m2')?.value) || 0;
    const tipo      = document.getElementById('e-tipo')?.value;
    const ubicacion = document.getElementById('e-ubic')?.value?.trim();
    const notas     = document.getElementById('e-notas')?.value?.trim();
    const fil       = document.getElementById('e-fil')?.value || '';
    const diasObra  = parseInt(document.getElementById('e-diasobra')?.value) || 0;
    const assignedTo= document.getElementById('e-asignado')?.value || '';
    const contacts  = {
        comercial:      { nom: document.getElementById('e-cc-nom')?.value?.trim()||'', email: document.getElementById('e-cc-email')?.value?.trim()||'', tel: document.getElementById('e-cc-tel')?.value?.trim()||'' },
        administracion: { nom: document.getElementById('e-ca-nom')?.value?.trim()||'', email: document.getElementById('e-ca-email')?.value?.trim()||'', tel: document.getElementById('e-ca-tel')?.value?.trim()||'' },
        legales:        { nom: document.getElementById('e-cl-nom')?.value?.trim()||'', email: document.getElementById('e-cl-email')?.value?.trim()||'', tel: document.getElementById('e-cl-tel')?.value?.trim()||'' },
    };

    if (!cliente)  { toast('⚠️ Completá el nombre del cliente');  return; }
    if (!proyecto) { toast('⚠️ Completá el nombre del proyecto'); return; }

    const hasItems = sesModules.some(m => (sesItems[m.id]||[]).length > 0);
    if (metros <= 0 && !hasItems) {
        toast('⚠️ Ingresá los m² o agregá ítems en algún módulo');
        return;
    }

    const margen = getMGForm();
    const mg  = margen / 100;
    const mods = sesModules.map(m => ({
        ...m,
        on:          modOn[m.id] !== false,
        items:       JSON.parse(JSON.stringify(sesItems[m.id] || [])),
        files:       JSON.parse(JSON.stringify(sesFiles[m.id] || [])),
        notes:       sesNotes[m.id] || '',
        proveedores: JSON.parse(JSON.stringify(sesProvs[m.id] || [])),
        sub:         modTotal(m.id, metros),
        mode:        modMode(m.id),
    }));

    const baseTotal = mods.reduce((s,m) => s + m.sub, 0);
    const tcSave    = getTCForm();
    const moneda    = sesCurrency || 'USD';
    // Guardamos precio al cliente (base + MG%) como totalUSD/ARS
    // El costo base queda implícito: totalUSD / (1+mg)
    const baseUSD   = moneda === 'ARS' ? baseTotal / tcSave : baseTotal;
    const baseARS   = moneda === 'ARS' ? baseTotal           : baseTotal * tcSave;
    const totalUSD  = baseUSD * (1 + mg);   // precio al cliente en USD
    const totalARS  = baseARS * (1 + mg);   // precio al cliente en ARS
    const lo = totalUSD * 0.9, hi = totalUSD * 1.1;  // ±10% estimación preliminar
    const now = new Date().toISOString();
    const actEntry = { id: uid(), userId: currentUser?.id || '', action: editId ? 'edit' : 'create', ts: now };

    if (editId) {
        const idx = plist.findIndex(p => p.id === editId);
        if (idx >= 0) {
            const prev = plist[idx];
            plist[idx] = { ...prev, cliente, proyecto, tipo, ubicacion, notas, metros, fil, diasObra, margen, assignedTo,
                           contacts, logo: sesLogo, moneda,
                           totalUSD, loUSD:lo, hiUSD:hi, totalARS,
                           usdArs:tcSave, modules:mods, status, updAt:now,
                           activity: [...(prev.activity||[]), actEntry] };
        }
        saveDB(); toast('✅ Presupuesto actualizado');
        nav('detalle', editId);
    } else {
        const id = Date.now().toString();
        plist.push({ id, num:nextN(), cliente, proyecto, tipo, ubicacion, notas, metros, fil, diasObra, margen, assignedTo,
                     contacts, logo: sesLogo, moneda,
                     totalUSD, loUSD:lo, hiUSD:hi, totalARS,
                     usdArs:tcSave, modules:mods, status, fecha:now, updAt:now,
                     attachments:[], comments:[], activity:[actEntry] });
        saveDB(); toast('✅ Presupuesto guardado');
        initSes();
        presMode = null;
        nav('historial');
    }
}

        p.proyecto.toLowerCase().includes(ql) ||
        String(p.num).includes(ql)

function startEdit(id, scrollToModules) {
    initSes();
    editId = id;
    nav('estimador', id);
    if (scrollToModules) {
        setTimeout(() => {
            const el = document.getElementById('est-modulos');
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 80);
    }
}

function startEditModule(presupId, modId) {
    initSes();
    editId = presupId;
    nav('estimador', presupId);
    setTimeout(() => {
        // Expand the module first
        if (!modExpand[modId]) toggleExpand(modId);
        // Then scroll the .content container to that module row
        setTimeout(() => {
            const content = document.querySelector('.content');
            const modRow  = document.getElementById('mr-' + modId);
            if (content && modRow) {
                const top = modRow.getBoundingClientRect().top
                          - content.getBoundingClientRect().top
                          + content.scrollTop
                          - 16; // small top padding
                content.scrollTo({ top, behavior: 'smooth' });
            }
        }, 60);
    }, 100);
}

function delP(id) {
    if (!confirm('¿Eliminar este presupuesto? Esta acción no se puede deshacer.')) return;
    plist = plist.filter(p => p.id !== id);
    saveDB(); toast('🗑️ Eliminado'); nav('historial');
}

                            <div style="font-size:16px;font-weight:700">${fPriP(priAmtP(p), p)}</div>
                            <div style="font-size:12px;color:#aaa;margin-top:2px">${fSecP(priAmtP(p), p)}</div>

    </div>`;
}

// Parsea números en formato argentino "1.234,56" → 1234.56
function parseFmt(str) {
    if (str === '' || str == null) return 0;
    return parseFloat(String(str).replace(/\./g, '').replace(',', '.')) || 0;
}

function liveSubDet(itemId, presupId) {
    const row = document.getElementById('dmi-row-' + itemId);
    if (!row) return;
    const qty  = parseFloat(row.querySelector('[data-field="qty"]')?.value)      || 0;
    const pmat = parseFmt(row.querySelector('[data-field="pricemat"]')?.value);
    const pmo  = parseFmt(row.querySelector('[data-field="pricemo"]')?.value);
    const sub  = qty * (pmat + pmo);
    const subEl = document.getElementById('dmi-sub-' + itemId);
    const p     = plist.find(x => x.id === presupId);
    if (subEl && p) subEl.textContent = (p.moneda||'USD')==='ARS' ? fARS2(sub) : fUSD2(sub);
}

function saveDetItem(presupId, modId, itemId, field, rawVal) {
    const pi  = plist.findIndex(x => x.id === presupId);
    if (pi < 0) return;
    const mod  = (plist[pi].modules || []).find(m => m.id === modId);
    if (!mod)  return;
    const item = (mod.items || []).find(it => it.id === itemId);
    if (!item) return;
    item[field] = (field === 'qty') ? (parseFloat(rawVal) || 0)
                : (field === 'priceMat' || field === 'priceMO') ? (parseFmt(rawVal) || 0)
                : rawVal;
    // Reformat price display after save
    if (field === 'priceMat' || field === 'priceMO') {
        const dfKey = field === 'priceMat' ? 'pricemat' : 'pricemo';
        const inp = document.querySelector(`#dmi-row-${itemId} [data-field="${dfKey}"]`);
        if (inp && document.activeElement !== inp) inp.value = fmtD(item[field]);
    }
    // Recalc module sub
    mod.sub = (mod.items||[]).reduce((s,it) => s + (parseFloat(it.qty)||0)*((parseFloat(it.priceMat??it.priceUSD??0)||0)+(parseFloat(it.priceMO)||0)), 0);
    _recalcPresupTotals(pi);
    saveDB();
    // Update module total badge
    const p = plist[pi];
    const totEl = document.getElementById('dm-tot-' + modId);
    if (totEl) totEl.innerHTML = `<div class="det-mod-usd">${fPriP(mod.sub,p)}</div><div class="det-mod-ars">${fSecP(mod.sub,p)}</div>`;
    updateResultPanel(presupId);
}

function addDetItem(presupId, modId) {
    const pi  = plist.findIndex(x => x.id === presupId);
    if (pi < 0) return;
    const mod = (plist[pi].modules||[]).find(m => m.id === modId);
    if (!mod)  return;
    if (!mod.items) mod.items = [];
    const newItem = { id: Date.now().toString(36)+Math.random().toString(36).slice(2,5), desc:'', qty:1, unit:'gl', priceMat:0, priceMO:0 };
    mod.items.push(newItem);
    saveDB();
    const tbody = document.getElementById('dmi-tbody-' + modId);
    const p     = plist[pi];
    if (tbody) {
        tbody.insertAdjacentHTML('beforeend', vDetItemRow(newItem, mod.items.length-1, modId, p));
        // Focus desc input of new row
        const newRow = document.getElementById('dmi-row-' + newItem.id);
        if (newRow) newRow.querySelector('[data-field="desc"]')?.focus();
    }
}

function rmDetItem(presupId, modId, itemId) {
    const pi  = plist.findIndex(x => x.id === presupId);
    if (pi < 0) return;
    const mod = (plist[pi].modules||[]).find(m => m.id === modId);
    if (!mod)  return;
    mod.items = (mod.items||[]).filter(it => it.id !== itemId);
    mod.sub   = (mod.items||[]).reduce((s,it) => s + (parseFloat(it.qty)||0)*((parseFloat(it.priceMat??it.priceUSD??0)||0)+(parseFloat(it.priceMO)||0)), 0);
    _recalcPresupTotals(pi);
    saveDB();
    document.getElementById('dmi-row-' + itemId)?.remove();
    const p = plist[pi];
    const totEl = document.getElementById('dm-tot-' + modId);
    if (totEl) totEl.innerHTML = `<div class="det-mod-usd">${fPriP(mod.sub,p)}</div><div class="det-mod-ars">${fSecP(mod.sub,p)}</div>`;
    updateResultPanel(presupId);
}

function _recalcPresupTotals(pi) {
    const p      = plist[pi];
    const tc     = p.usdArs || cfg.usdArs || 1;
    const isARS  = (p.moneda||'USD') === 'ARS';
    const mg     = (p.margen || cfg.margen || 10) / 100;
    const base   = (p.modules||[]).reduce((s,m) => s + (m.sub||0), 0);
    const baseUSD = isARS ? base/tc : base;
    const baseARS = isARS ? base    : base*tc;
    // Precio Costo (sin margen)
    p.costoUSD   = baseUSD;
    p.costoARS   = baseARS;
    // totalUSD/ARS = precio al cliente (base + MG%)
    p.totalUSD   = baseUSD * (1 + mg);
    p.totalARS   = baseARS * (1 + mg);
    p.loUSD      = p.totalUSD * 0.9;   // ±10% estimación preliminar
    p.hiUSD      = p.totalUSD * 1.1;
    p.updatedAt  = new Date().toISOString();
}

function updateResultPanel(presupId) {
    const p = plist.find(x => x.id === presupId);
    if (!p) return;
    const isARS = (p.moneda||'USD') === 'ARS';
    const m2    = parseFloat(p.metros || p.m2 || 0);
    const costoPri  = isARS ? (p.costoARS||0) : (p.costoUSD||0);
    const ventaPri  = priAmtP(p);

    const e = id => document.getElementById(id);
    if (e('rp-costo-pri')) e('rp-costo-pri').textContent = fPriP(costoPri, p);
    if (e('rp-costo-sec')) e('rp-costo-sec').textContent = fSecP(costoPri, p);
    if (e('rp-costo-m2'))  e('rp-costo-m2').textContent  = m2 > 0 ? fPriP(costoPri/m2, p) + ' / m²' : '— sin m² cargados';
    if (e('rp-venta-pri')) e('rp-venta-pri').textContent = fPriP(ventaPri, p);
    if (e('rp-venta-sec')) e('rp-venta-sec').textContent = fSecP(ventaPri, p);
    if (e('rp-venta-m2'))  e('rp-venta-m2').textContent  = m2 > 0 ? fPriP(ventaPri/m2, p) + ' / m²' : '— sin m² cargados';
    if (e('rp-margen-inp') && document.activeElement !== e('rp-margen-inp'))
        e('rp-margen-inp').value = p.margen ?? cfg.margen;
}

// Actualización en tiempo real del margen (sin guardar)
function updatePanelMargen(presupId, mgVal) {
    const p = plist.find(x => x.id === presupId);
    if (!p) return;
    const mg    = (parseFloat(mgVal) || 0) / 100;
    const isARS = (p.moneda||'USD') === 'ARS';
    const m2    = parseFloat(p.metros || p.m2 || 0);
    const costoPri = isARS ? (p.costoARS||0) : (p.costoUSD||0);
    const ventaPri = costoPri * (1 + mg);
    const e = id => document.getElementById(id);
    if (e('rp-venta-pri')) e('rp-venta-pri').textContent = fPriP(ventaPri, p);
    if (e('rp-venta-sec')) e('rp-venta-sec').textContent = fSecP(ventaPri, p);
    if (e('rp-venta-m2'))  e('rp-venta-m2').textContent  = m2 > 0 ? fPriP(ventaPri/m2, p) + ' / m²' : '— sin m² cargados';
}

// Guarda el margen y recalcula totales al salir del campo
function applyPanelMargen(presupId, mgVal) {
    const pi = plist.findIndex(x => x.id === presupId);
    if (pi < 0) return;
    const mg = parseFloat(mgVal);
    if (isNaN(mg) || mg < 0) return;
    plist[pi].margen = mg;
    _recalcPresupTotals(pi);
    saveDB();
    updateResultPanel(presupId);
    toast(`✓ Margen actualizado a ${mg}%`);
}

//  COMMENTS & MENTIONS
// ═══════════════════════════════════════════════════
const fDateTime = s => {
    const d = new Date(s);
    return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'}) + ' ' +
           d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
};

function renderComments(p) {
    const comments = p.comments || [];
    if (!comments.length) return `<div style="font-size:14px;color:#ccc;text-align:center;padding:12px 0">Sin comentarios aún. Sé el primero en comentar.</div>`;
    return comments.map(c => {
        const u    = getUser(c.userId);
        const mine = currentUser && c.userId === currentUser.id;
        const textHtml = esc(c.text).replace(/@(\w+)/g, (_, handle) => {
            const found = users.find(u => u.name.replace(/\s+/g,'').toLowerCase() === handle.toLowerCase()
                                       || u.name.split(' ')[0].toLowerCase() === handle.toLowerCase());
            return found ? `<span class="mention-tag">@${esc(found.name)}</span>` : `@${handle}`;
        });
        return `<div class="comment-item ${mine?'comment-mine':''}">
            ${mine ? '' : (u ? userAvatar(u,'sm') : '')}
            <div class="comment-body">
                <div class="comment-header">
                    <span class="comment-name">${u ? esc(u.name) : 'Desconocido'}</span>
                    <span class="comment-ts">${fDateTime(c.ts)}</span>
                    ${mine ? `<span class="comment-rm" onclick="rmComment('${p.id}','${c.id}')">✕</span>` : ''}
                </div>
                <div class="comment-text">${textHtml}</div>
            </div>
            ${mine ? (u ? userAvatar(u,'sm') : '') : ''}
        </div>`;
    }).join('');
}

function addComment(presupId) {
    if (!currentUser) { toast('⚠️ Seleccioná un usuario primero'); return; }
    const ta = document.getElementById(`ci-${presupId}`);
    const text = ta?.value?.trim();
    if (!text) return;

    const p = plist.find(x => x.id === presupId);
    if (!p) return;

    // Extract @mentions → match by first name or full name (no spaces)
    const mentions = [];
    const re = /@(\S+)/g;
    let m;
    while ((m = re.exec(text)) !== null) {
        const handle = m[1].toLowerCase();
        const found = users.find(u =>
            u.name.replace(/\s+/g,'').toLowerCase() === handle ||
            u.name.split(' ')[0].toLowerCase() === handle
        );
        if (found && !mentions.includes(found.id)) mentions.push(found.id);
    }

    const comment = { id: uid(), userId: currentUser.id, text, mentions, read: [currentUser.id], ts: new Date().toISOString() };
    p.comments = [...(p.comments||[]), comment];

    // Add activity entry
    const actEntry = { id: uid(), userId: currentUser.id, action: 'comment', ts: comment.ts };
    p.activity = [...(p.activity||[]), actEntry];

    saveDB();
    ta.value = '';
    ta.style.height = 'auto';

    // Refresh comment thread
    const ct = document.getElementById(`ct-${presupId}`);
    if (ct) ct.innerHTML = renderComments(p);

    // Scroll to bottom
    ct?.lastElementChild?.scrollIntoView({ behavior:'smooth' });

    renderTopbarUser();
    if (mentions.length) toast(`💬 Comentario enviado — se mencionó a ${mentions.length} persona(s)`);
    else toast('💬 Comentario agregado');
}

function rmComment(presupId, commentId) {
    const p = plist.find(x => x.id === presupId);
    if (!p) return;
    p.comments = (p.comments||[]).filter(c => c.id !== commentId);
    saveDB();
    const ct = document.getElementById(`ct-${presupId}`);
    if (ct) ct.innerHTML = renderComments(p);
}

function markMentionsRead(presupId) {
    if (!currentUser) return;
    const p = plist.find(x => x.id === presupId);
    if (!p) return;
    let changed = false;
    (p.comments||[]).forEach(c => {
        if ((c.mentions||[]).includes(currentUser.id) && !(c.read||[]).includes(currentUser.id)) {
            c.read = [...(c.read||[]), currentUser.id];
            changed = true;
        }
    });
    if (changed) { saveDB(); renderTopbarUser(); }
}

// ─── @mention autocomplete ───
let mentionQuery = '';
let mentionStart = -1;

function onCommentInput(presupId, ta) {
    // Auto-resize textarea
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';

    const val = ta.value;
    const pos = ta.selectionStart;
    const before = val.slice(0, pos);
    const atIdx = before.lastIndexOf('@');

    const sugg = document.getElementById(`ms-${presupId}`);
    if (!sugg) return;

    if (atIdx >= 0 && !before.slice(atIdx+1).includes(' ')) {
        mentionQuery = before.slice(atIdx+1).toLowerCase();
        mentionStart = atIdx;
        const matches = activeUsers().filter(u =>
            u.name.toLowerCase().includes(mentionQuery) && u.id !== currentUser?.id
        ).slice(0, 5);

        if (matches.length) {
            sugg.style.display = 'block';
            sugg.innerHTML = matches.map(u => `
                <div class="mention-sug-item" onclick="insertMention('${presupId}','${u.name}')">
                    ${userAvatar(u,'sm')}
                    <span class="mention-sug-name">${esc(u.name)}</span>
                    <span class="mention-sug-role">${roleLbl(u.role)}</span>
                </div>`).join('');
        } else {
            sugg.style.display = 'none';
        }
    } else {
        sugg.style.display = 'none';
        mentionStart = -1;
    }
}

function insertMention(presupId, name) {
    const ta = document.getElementById(`ci-${presupId}`);
    const sugg = document.getElementById(`ms-${presupId}`);
    if (!ta) return;
    const val = ta.value;
    const firstName = name.split(' ')[0];
    ta.value = val.slice(0, mentionStart) + '@' + firstName + ' ' + val.slice(ta.selectionStart);
    sugg.style.display = 'none';
    ta.focus();
    const newPos = mentionStart + firstName.length + 2;
    ta.setSelectionRange(newPos, newPos);
}

// ─── @mention en notas de módulo ───
let modMentionStart = {};   // { modId: number }
let modMentionQuery = {};   // { modId: string }

function onModNoteInput(modId, ta) {
    // Persist note value
    sesNotes[modId] = ta.value;
    ta.classList.toggle('populated', ta.value.length > 0);
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 280) + 'px';

    const val = ta.value;
    const pos = ta.selectionStart;
    const before = val.slice(0, pos);
    const atIdx = before.lastIndexOf('@');
    const sugg = document.getElementById(`mn-sugg-${modId}`);
    if (!sugg) return;

    if (atIdx >= 0 && !before.slice(atIdx + 1).includes(' ')) {
        modMentionQuery[modId] = before.slice(atIdx + 1).toLowerCase();
        modMentionStart[modId] = atIdx;
        const matches = activeUsers().filter(u =>
            u.name.toLowerCase().includes(modMentionQuery[modId])
        ).slice(0, 5);

        if (matches.length) {
            sugg.style.display = 'block';
            sugg.innerHTML = matches.map(u => `
                <div class="mention-sug-item" onclick="insertModMention('${modId}','${u.name}')">
                    ${userAvatar(u, 'sm')}
                    <span class="mention-sug-name">${esc(u.name)}</span>
                    <span class="mention-sug-role">${roleLbl(u.role)}</span>
                </div>`).join('');
        } else {
            sugg.style.display = 'none';
        }
    } else {
        sugg.style.display = 'none';
        modMentionStart[modId] = -1;
    }
}

function insertModMention(modId, name) {
    const ta   = document.getElementById(`mn-${modId}`);
    const sugg = document.getElementById(`mn-sugg-${modId}`);
    if (!ta) return;
    const firstName = name.split(' ')[0];
    const start = modMentionStart[modId] ?? -1;
    ta.value = ta.value.slice(0, start) + '@' + firstName + ' ' + ta.value.slice(ta.selectionStart);
    sesNotes[modId] = ta.value;
    sugg.style.display = 'none';
    ta.focus();
    const newPos = start + firstName.length + 2;
    ta.setSelectionRange(newPos, newPos);
}

// ─── Attachments ───
function attHTML(p) {
    if (!p.attachments?.length) return '';
    return `<div class="att-list">${p.attachments.map((a,i) => `
        <div class="att-item">
            <span>${fileIco(a.name)}</span><span>${esc(a.name)}</span>
            <span style="color:#bbb">${fSize(a.size)}</span>
            <span class="att-rm" onclick="rmAtt('${p.id}',${i})">×</span>
        </div>`).join('')}</div>`;
}

function addFiles(id, inp) {
    const p = plist.find(x => x.id === id);
    if (!p) return;
    if (!p.attachments) p.attachments = [];
    Array.from(inp.files).forEach(f =>
        p.attachments.push({ name:f.name, size:f.size, type:f.type, date:new Date().toISOString() })
    );
    saveDB();
    document.getElementById(`att-${id}`).innerHTML = attHTML(p);
    toast(`✅ ${inp.files.length} archivo(s) adjuntado(s)`);
    inp.value = '';
}

function rmAtt(id, idx) {
    const p = plist.find(x => x.id === id);
    if (!p) return;
    p.attachments.splice(idx, 1);
    saveDB();
    document.getElementById(`att-${id}`).innerHTML = attHTML(p);
}

function setStatus(id, s) {
    const p = plist.find(x => x.id === id);
    if (p) { p.status = s; saveDB(); nav('detalle', id); toast(`Estado → ${statusLbl(s)}`); }
}

function dupP(id) {
    const o = plist.find(x => x.id === id);
    if (!o) return;
    const np = JSON.parse(JSON.stringify(o));
    np.id          = Date.now().toString();
    np.num         = nextN();
    np.fecha       = new Date().toISOString();
    np.updatedAt   = new Date().toISOString();
    np.createdAt   = new Date().toISOString();
    np.status      = 'borrador';
    np.attachments = [];
    np.activity    = [];
    np.notas       = (np.notas||'') ? '[Duplicado de #'+o.num+'] ' + np.notas : '[Duplicado de #'+o.num+']';
    plist.push(np); saveDB();

    // Hint si hay ítems vinculados a proveedores
    const hasSuppItems = (np.modules||[]).some(m => (m.items||[]).some(it => it.supplierId));
    if (hasSuppItems) {
        toast('📋 Presupuesto #'+np.num+' creado · Abrí los módulos para 🔄 actualizar precios');
    } else {
        toast('📋 Duplicado como presupuesto #'+np.num);
    }
    nav('detalle', np.id);
}

    return users.map(u => `
    <div style="display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid #f5f5f5;${!u.active?'opacity:.45':''}">

            <div style="font-size:13px;color:#aaa">${roleLbl(u.role)}</div>
        </div>
        <span class="${roleTagClass(u.role)}">${roleLbl(u.role)}</span>
        ${u.active !== false
            ? `<button class="btn btn-ghost btn-sm" onclick="editUserModal('${u.id}')" title="Editar">✏️</button>
               <button class="btn btn-ghost btn-sm" onclick="deactivateUser('${u.id}')" title="Desactivar" style="color:#ddd">✕</button>`
            : `<button class="btn btn-ghost btn-sm" onclick="reactivateUser('${u.id}')" title="Reactivar" style="color:#aaa;font-size:12px">↩ Activar</button>`

function addUserForm() {
    showUserModal(null);
}

function editUserModal(userId) {
    showUserModal(userId);
}

function showUserModal(userId) {
    const u = userId ? getUser(userId) : null;
    const isNew = !u;
    const colorOpts = USER_COLORS.map((c,i) => `
        <div onclick="this.parentElement.querySelectorAll('.cc').forEach(x=>x.classList.remove('sel'));this.classList.add('sel');document.getElementById('um-color').value='${c}'"
             class="cc ${(u?.color||USER_COLORS[0])===c?'sel':''}"
             style="width:28px;height:28px;border-radius:50%;background:${c};cursor:pointer;border:3px solid ${(u?.color||USER_COLORS[0])===c?'#fff':'transparent'};box-shadow:${(u?.color||USER_COLORS[0])===c?'0 0 0 2px '+c:'none'}">
        </div>`).join('');

    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'user-modal';
    overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
    overlay.innerHTML = `
    <div class="modal" onclick="event.stopPropagation()" style="width:380px">
        <h2>${isNew ? 'Nuevo usuario' : 'Editar usuario'}</h2>
        <p class="msub">${isNew ? 'Completá los datos del nuevo integrante' : 'Modificá los datos del usuario'}</p>
        <div class="fg">
            <label class="flabel">Nombre completo</label>
            <input class="finput" id="um-name" type="text" value="${esc(u?.name||'')}" placeholder="Ej: María García">
        </div>
        <div class="fg">
            <label class="flabel">Rol</label>
            <select class="fselect" id="um-role">
                ${Object.entries(ROLE_LABELS).map(([k,v]) => `<option value="${k}" ${u?.role===k?'selected':''}>${v}</option>`).join('')}
            </select>
        </div>
        <div class="fg">
            <label class="flabel">Color de avatar</label>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">${colorOpts}</div>
            <input type="hidden" id="um-color" value="${u?.color||USER_COLORS[0]}">
        </div>
        <div style="display:flex;gap:10px;margin-top:24px">
            <button class="btn btn-primary" style="flex:1" onclick="saveUserModal('${userId||''}')">
                ${isNew ? 'Crear usuario' : 'Guardar cambios'}
            </button>
            <button class="btn btn-secondary" onclick="document.getElementById('user-modal').remove()">Cancelar</button>
        </div>
    </div>`;
    document.body.appendChild(overlay);
    document.getElementById('um-name').focus();
}

function saveUserModal(userId) {
    const name  = document.getElementById('um-name')?.value?.trim();
    const role  = document.getElementById('um-role')?.value;
    const color = document.getElementById('um-color')?.value || USER_COLORS[0];
    if (!name) { toast('⚠️ Ingresá el nombre'); return; }

    if (userId) {
        const u = getUser(userId);
        if (u) { u.name = name; u.role = role; u.color = color; }
    } else {
        users.push({ id: 'u_' + uid(), name, role, color, active: true, createdAt: new Date().toISOString() });
    }
    saveUsers();
    document.getElementById('user-modal')?.remove();
    const ul = document.getElementById('users-list');
    if (ul) ul.innerHTML = vUsersList();
    toast(userId ? '✅ Usuario actualizado' : `✅ Usuario "${name}" creado`);
}

function deactivateUser(userId) {
    const u = getUser(userId);
    if (!u) return;
    if (currentUser?.id === userId) { toast('⚠️ No podés desactivar tu propio usuario'); return; }
    u.active = false;
    saveUsers();
    const ul = document.getElementById('users-list');
    if (ul) ul.innerHTML = vUsersList();
    toast(`Usuario "${u.name}" desactivado`);
}

function reactivateUser(userId) {
    const u = getUser(userId);
    if (!u) return;
    u.active = true;
    saveUsers();
    const ul = document.getElementById('users-list');
    if (ul) ul.innerHTML = vUsersList();
    toast(`✅ Usuario "${u.name}" reactivado`);
}

//  MENCIONES VIEW
// ═══════════════════════════════════════════════════
function vMenciones() {
    if (!currentUser) return `<div class="empty"><div class="ei">🔔</div><h3>Seleccioná un usuario</h3><p>Elegí tu perfil para ver tus menciones.</p></div>`;

    const myMentions = [];
    plist.forEach(p => {
        (p.comments||[]).forEach(c => {
            if ((c.mentions||[]).includes(currentUser.id)) {
                const isRead = (c.read||[]).includes(currentUser.id);
                myMentions.push({ p, c, isRead });
            }
        });
    });

    myMentions.sort((a,b) => new Date(b.c.ts) - new Date(a.c.ts));
    const unread = myMentions.filter(x => !x.isRead);

    if (!myMentions.length) return `
        <div class="card">
            <div class="empty" style="padding:60px 20px">
                <div class="ei">🔔</div>
                <h3>Sin menciones</h3>
                <p>Cuando alguien te mencione con @${currentUser.name.split(' ')[0]}, aparecerá acá.</p>
            </div>
        </div>`;

    return `
    <div style="display:flex;flex-direction:column;gap:16px">
        ${unread.length > 0 ? `<div style="font-size:14px;color:#888">📬 <strong>${unread.length}</strong> mención${unread.length!==1?'es':''} sin leer</div>` : `<div style="font-size:14px;color:#aaa">✅ Todo leído</div>`}
        ${myMentions.map(({p, c, isRead}) => {
            const author = getUser(c.userId);
            const textHtml = esc(c.text).replace(/@(\w+)/g, (_, h) => `<span class="mention-tag">@${h}</span>`);
            return `
            <div class="card ${!isRead ? 'mention-unread' : ''}" onclick="nav('detalle','${p.id}')" style="cursor:pointer;${!isRead ? 'border-left:3px solid #2563eb' : ''}">
                <div class="card-bd" style="padding:14px 18px">
                    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
                        ${author ? userAvatar(author,'sm') : ''}
                        <span style="font-size:14px;font-weight:600">${author ? esc(author.name) : 'Alguien'}</span>
                        <span style="font-size:13px;color:#aaa">en <strong>#${p.num} ${esc(p.proyecto)}</strong></span>
                        <span style="font-size:12px;color:#ccc;margin-left:auto">${fDateTime(c.ts)}</span>
                        ${!isRead ? '<span style="width:8px;height:8px;border-radius:50%;background:#2563eb;flex-shrink:0"></span>' : ''}
                    </div>
                    <div style="font-size:14px;color:#555;padding:8px 12px;background:#f8f8f8;border-radius:7px;line-height:1.5">${textHtml}</div>
                </div>
            </div>`;
        }).join('')}
    </div>`;
}

                    <input class="finput" id="plt-catid-${ci}" type="text" value="${esc(cat.id)}"
                        title="Código del rubro (editable)"
                        style="margin-top:4px;font-size:14px;font-weight:700;font-family:monospace;text-align:center;color:${palette.text}">
                </div>
                <div style="flex:2;min-width:180px">
                    <label style="font-size:12px;color:#aaa;font-weight:600;text-transform:uppercase;letter-spacing:.7px">Nombre del rubro</label>
                    <input class="finput" id="plt-cn-${ci}" type="text" value="${esc(cat.nombre)}"
                        style="margin-top:4px;font-size:14px;font-weight:600" placeholder="Nombre del rubro">
                </div>
                <div style="width:130px;flex-shrink:0">
                    <label style="font-size:12px;color:#aaa;font-weight:600;text-transform:uppercase;letter-spacing:.7px">Unidad de medida</label>
                    <select class="finput" id="plt-umed-${ci}" style="margin-top:4px;font-size:14px;width:100%">
                        ${['m²','m³','ml','GL','un','hs','mes','kg'].map(u => `<option value="${u}"${(cat.unidad||'m²')===u?' selected':''}>${u}</option>`).join('')}
