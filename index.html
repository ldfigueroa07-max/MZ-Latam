                <div style="flex:1;min-width:160px">
                    <label style="font-size:12px;color:#aaa;font-weight:600;text-transform:uppercase;letter-spacing:.7px">Proveedor por defecto</label>
                    <div style="display:flex;gap:6px;align-items:center;margin-top:4px">
                        <div id="plt-cp-chip-${ci}"
                             style="flex:1;display:flex;align-items:center;gap:7px;padding:6px 10px;background:#fff;border:1px solid #e5e5e5;border-radius:6px;cursor:pointer;min-height:36px"
                             onclick="showPltProvPicker(${ci})" title="Seleccionar proveedor">
                            ${(cat.proveedor||'') ? `<span style="display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#131313;color:#fff;font-size:10px;font-weight:700;flex-shrink:0">${esc((cat.proveedor||'?')[0].toUpperCase())}</span>
                            <span style="font-size:13px;font-weight:500;color:#1a1a1a">${esc(cat.proveedor)}</span>` : `<span style="font-size:13px;color:#bbb">Sin proveedor asignado…</span>`}
                        </div>
                        ${(cat.proveedor||'') ? `<button class="btn btn-ghost btn-sm" onclick="clearPltProv(${ci})" style="color:#ddd;padding:3px 6px" title="Quitar proveedor">✕</button>` : ''}
                    </div>
                </div>
                <div style="display:flex;gap:6px;align-items:flex-end;padding-bottom:1px">
                    <button class="btn btn-ghost btn-sm" onclick="deletePlantillaCategoria(${ci})" style="color:#e5e5e5" title="Eliminar categoría">🗑</button>
                </div>
            </div>
            <!-- Items table -->
            <div id="plt-items-${ci}">
                ${plantillaItemsTable(cat, ci)}
            </div>
            <!-- Footer actions -->
            <div style="display:flex;justify-content:flex-end;gap:8px;padding:10px 18px;border-top:1px solid #f0f0f0;background:#fafafa">
                <button class="btn btn-secondary btn-sm" onclick="addPlantillaItem(${ci})">+ Ítem</button>
                <button class="btn btn-success btn-sm" onclick="savePlantillaForm()">💾 Guardar</button>
            </div>
        </div>
    </div>`;
}

function plantillaItemsTable(cat, ci) {
    if (!cat.items.length) return `<div style="padding:14px 20px;font-size:14px;color:#bbb">Sin ítems. Agregá uno con el botón "＋ Ítem".</div>`;
    return `
    <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;font-size:13px">
            <thead>
                <tr style="background:#f9f9f9;border-bottom:1px solid #eee">
                    <th style="padding:7px 12px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:#bbb;width:64px">ID</th>
                    <th style="padding:7px 8px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:#bbb">Descripción</th>
                    <th style="padding:7px 8px;text-align:right;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:#bbb;width:72px">Cant.</th>
                    <th style="padding:7px 8px;text-align:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:#bbb;width:60px">Unidad</th>
                    <th style="padding:7px 8px;text-align:right;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:#bbb;width:110px">Precio Mat. $</th>
                    <th style="padding:7px 8px;text-align:right;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:#bbb;width:110px">Precio MO $</th>
                    <th style="padding:7px 8px;text-align:right;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:#bbb;width:110px">Total $</th>
                    <th style="width:32px"></th>
                </tr>
            </thead>
            <tbody>
                ${cat.items.map((item, ii) => plantillaItemRow(item, ci, ii)).join('')}
            </tbody>
        </table>
    </div>`;
}

function plantillaItemRow(item, ci, ii) {
    const total = (item.cantidad||0) * ((item.precioMat||0) + (item.precioMO||0));
    const fmtARS = n => n ? '$ ' + Math.round(n).toLocaleString('es-AR') : '—';
    return `
    <tr id="plt-item-${ci}-${ii}" style="border-bottom:1px solid #f5f5f5;transition:background .12s" onmouseover="this.style.background='#fafafa'" onmouseout="this.style.background=''">
        <td style="padding:4px 8px">
            <input class="finput" id="plt-id-${ci}-${ii}" type="text" value="${esc(item.id)}"
                title="Código del ítem (editable)"
                style="font-size:12px;font-family:monospace;font-weight:600;color:#6366f1;padding:3px 6px;width:72px;text-align:center">
        </td>
        <td style="padding:7px 8px">
            <input class="finput" id="plt-d-${ci}-${ii}" type="text" value="${esc(item.descripcion)}"
                style="font-size:13px;padding:4px 7px;width:100%;min-width:200px">
        </td>
        <td style="padding:7px 8px">
            <input class="finput" id="plt-q-${ci}-${ii}" type="number" min="0" step="any" value="${item.cantidad||0}"
                style="font-size:13px;padding:4px 7px;text-align:right;width:64px"
                oninput="pltLiveTotal(${ci},${ii})">
        </td>
        <td style="padding:7px 8px">
            <input class="finput" id="plt-u-${ci}-${ii}" type="text" value="${esc(item.unidad||'GL')}"
                style="font-size:13px;padding:4px 7px;text-align:center;width:52px">
        </td>
        <td style="padding:7px 8px">
            <input class="finput" id="plt-pm-${ci}-${ii}" type="number" min="0" step="any" value="${item.precioMat||0}"
                style="font-size:13px;padding:4px 7px;text-align:right;width:100px"
                oninput="pltLiveTotal(${ci},${ii})">
        </td>
        <td style="padding:7px 8px">
            <input class="finput" id="plt-po-${ci}-${ii}" type="number" min="0" step="any" value="${item.precioMO||0}"
                style="font-size:13px;padding:4px 7px;text-align:right;width:100px"
                oninput="pltLiveTotal(${ci},${ii})">
        </td>
        <td style="padding:7px 8px;text-align:right;font-weight:600;color:${total>0?'#16a34a':'#ccc'};white-space:nowrap">
            <span id="plt-tot-${ci}-${ii}">${fmtARS(total)}</span>
        </td>
        <td style="padding:4px 8px;text-align:center">
            <button class="btn btn-ghost btn-sm" onclick="deletePlantillaItem(${ci},${ii})"
                style="color:#e0e0e0;padding:2px 5px;font-size:13px" title="Eliminar ítem">✕</button>
        </td>
    </tr>`;
}


// ─── Plantilla: supplier picker modal ───
function showPltProvPicker(ci) {
    const existing = document.getElementById('plt-prov-overlay');
    if (existing) existing.remove();

    const overlay = document.createElement('div');
    overlay.id = 'plt-prov-overlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9200;display:flex;align-items:flex-start;justify-content:center;padding:60px 20px 20px';
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });

    const cat = plantilla[ci];
    const catName = cat ? cat.nombre : '';

    overlay.innerHTML = `
    <div style="background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:100%;max-width:480px;display:flex;flex-direction:column;max-height:80vh">
        <!-- Header -->
        <div style="padding:16px 20px 12px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;flex-shrink:0">
            <div>
                <div style="font-size:16px;font-weight:800">Asignar proveedor</div>
                <div style="font-size:13px;color:#aaa;margin-top:2px">${esc(catName)}</div>
            </div>
            <button onclick="document.getElementById('plt-prov-overlay').remove()"
                style="background:none;border:none;font-size:22px;color:#aaa;cursor:pointer;line-height:1">×</button>
        </div>
        <!-- Search -->
        <div style="padding:12px 16px;flex-shrink:0;border-bottom:1px solid #f5f5f5">
            <input class="finput" id="plt-prov-search" type="text" placeholder="Buscar por nombre…"
                style="font-size:14px" oninput="filterPltProvList(${ci})"
                value="">
        </div>
        <!-- Free text option -->
        <div style="padding:8px 16px 4px;flex-shrink:0">
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:#bbb;margin-bottom:6px">O escribí un nombre libre</div>
            <div style="display:flex;gap:6px">
                <input class="finput" id="plt-prov-free" type="text" placeholder="Nombre del proveedor…"
                    style="flex:1;font-size:14px" value="${esc(cat ? cat.proveedor||'' : '')}">
                <button class="btn btn-secondary btn-sm" onclick="setPltProvFree(${ci})">Usar</button>
            </div>
        </div>
        <!-- Supplier list -->
        <div id="plt-prov-list" style="overflow-y:auto;flex:1;padding:8px 0">
            ${renderPltProvList(ci, '')}
        </div>
    </div>`;

    document.body.appendChild(overlay);
    setTimeout(() => document.getElementById('plt-prov-search')?.focus(), 80);
}

function renderPltProvList(ci, filter) {
    const q = (filter||'').toLowerCase().trim();
    let list = suppliers.slice();
    if (q) list = list.filter(s => s.name.toLowerCase().includes(q));
    if (!list.length) {
        return '<div style="padding:20px;text-align:center;color:#bbb;font-size:14px">' +
               (suppliers.length ? 'Sin coincidencias — usá el nombre libre.' : 'No hay proveedores en el directorio aún.') +
               '</div>';
    }
    return list.map(s => {
        const av = supplierAvColor(s);
        const initials = supplierInitials(s);
        const specs = (s.specialty||[]).map(id => {
            const mod = cfg.modules.find(m => m.id === id);
            if (!mod) return '';
            const mc = modColor(id);
            return `<span style="display:inline-block;padding:1px 6px;border-radius:10px;font-size:10px;font-weight:600;background:${mc.bg};color:${mc.text};margin-right:2px">${mod.name}</span>`;
        }).join('');
        return `
        <div onclick="selectPltProv(${ci},'${s.id}','${s.name.replace(/'/g,"\'")}')"
             style="display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;transition:background .12s"
             onmouseover="this.style.background='#f8f8f8'" onmouseout="this.style.background=''">
            <span style="display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:${av.bg};color:${av.text};font-size:12px;font-weight:700;flex-shrink:0">${esc(initials)}</span>
            <div style="flex:1;min-width:0">
                <div style="font-size:14px;font-weight:600;color:#1a1a1a">${esc(s.name)}</div>
                ${specs ? `<div style="margin-top:2px">${specs}</div>` : ''}
            </div>
            <span style="font-size:18px;color:#e0e0e0">›</span>
        </div>`;
    }).join('');
}

function filterPltProvList(ci) {
    const q = document.getElementById('plt-prov-search')?.value || '';
    const listEl = document.getElementById('plt-prov-list');
    if (listEl) listEl.innerHTML = renderPltProvList(ci, q);
}

function selectPltProv(ci, supId, supName) {
    const cat = plantilla[ci];
    if (!cat) return;
    cat.proveedor = supName;
    savePlantilla();
    document.getElementById('plt-prov-overlay')?.remove();
    _refreshPltProvChip(ci);
    toast('✅ Proveedor asignado: ' + supName);
}

function setPltProvFree(ci) {
    const val = document.getElementById('plt-prov-free')?.value.trim();
    if (!val) { toast('⚠️ Ingresá un nombre'); return; }
    const cat = plantilla[ci];
    if (!cat) return;
    cat.proveedor = val;
    savePlantilla();
    document.getElementById('plt-prov-overlay')?.remove();
    _refreshPltProvChip(ci);
    toast('✅ Proveedor asignado: ' + val);
}

function clearPltProv(ci) {
    const cat = plantilla[ci];
    if (!cat) return;
    cat.proveedor = '';
    savePlantilla();
    _refreshPltProvChip(ci);
}

function _refreshPltProvChip(ci) {
    // Update the chip display without full re-render
    const cat = plantilla[ci];
    if (!cat) return;
    const chipEl = document.getElementById('plt-cp-chip-' + ci);
    if (!chipEl) return;
    const prov = cat.proveedor || '';
    if (prov) {
        chipEl.innerHTML = `<span style="display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#131313;color:#fff;font-size:10px;font-weight:700;flex-shrink:0">${esc(prov[0].toUpperCase())}</span>
        <span style="font-size:13px;font-weight:500;color:#1a1a1a">${esc(prov)}</span>`;
        // Update/add the clear button
        let clearBtn = chipEl.nextElementSibling;
        if (!clearBtn || !clearBtn.getAttribute('onclick')?.includes('clearPltProv')) {
            const btn = document.createElement('button');
            btn.className = 'btn btn-ghost btn-sm';
            btn.setAttribute('onclick', 'clearPltProv(' + ci + ')');
            btn.style.cssText = 'color:#ddd;padding:3px 6px';
            btn.title = 'Quitar proveedor';
            btn.textContent = '✕';
            chipEl.parentElement.appendChild(btn);
        }
    } else {
        chipEl.innerHTML = '<span style="font-size:13px;color:#bbb">Sin proveedor asignado…</span>';
        const clearBtn = chipEl.nextElementSibling;
        if (clearBtn && clearBtn.getAttribute('onclick')?.includes('clearPltProv')) clearBtn.remove();
    }
    // Also refresh the category header badge
    const hdr = document.querySelector('#plt-cat-' + ci + ' > div > span.plt-prov-badge');
    // Simple approach: re-render the whole header section text
}

// Live total update while editing
function pltLiveTotal(ci, ii) {
    const q  = parseFloat(document.getElementById('plt-q-' +ci+'-'+ii)?.value) || 0;
    const pm = parseFloat(document.getElementById('plt-pm-'+ci+'-'+ii)?.value) || 0;
    const po = parseFloat(document.getElementById('plt-po-'+ci+'-'+ii)?.value) || 0;
    const tot = q * (pm + po);
    const el = document.getElementById('plt-tot-'+ci+'-'+ii);
    if (el) {
        el.textContent = tot > 0 ? '$ ' + Math.round(tot).toLocaleString('es-AR') : '—';
        el.style.color = tot > 0 ? '#16a34a' : '#ccc';
    }
}

function togglePlantillaCat(ci) {
    if (!window._pltOpen) window._pltOpen = {};
    window._pltOpen[ci] = !window._pltOpen[ci];
    const body   = document.getElementById('plt-body-'+ci);
    const header = document.querySelector('#plt-cat-'+ci+' > div > span:last-child');
    if (body)   body.style.display = window._pltOpen[ci] ? 'block' : 'none';
    if (header) header.style.transform = 'rotate(' + (window._pltOpen[ci] ? 90 : 0) + 'deg)';
    // Update header bg
    const hdr = document.querySelector('#plt-cat-'+ci+' > div');
    if (hdr) hdr.style.background = window._pltOpen[ci] ? '#fafafa' : '#fff';
}

function savePlantillaForm() {
    plantilla.forEach((cat, ci) => {
        const catIdEl = document.getElementById('plt-catid-'+ci);
        const nameEl  = document.getElementById('plt-cn-'+ci);
        const umedEl  = document.getElementById('plt-umed-'+ci);
        if (catIdEl && catIdEl.value.trim()) cat.id = catIdEl.value.trim();
        if (nameEl)  cat.nombre = nameEl.value.trim() || cat.nombre;
        if (umedEl)  cat.unidad = umedEl.value || 'm²';
        cat.items.forEach((item, ii) => {
            const idEl   = document.getElementById('plt-id-'+ci+'-'+ii);
            const descEl = document.getElementById('plt-d-'+ci+'-'+ii);
            const qEl    = document.getElementById('plt-q-'+ci+'-'+ii);
            const uEl    = document.getElementById('plt-u-'+ci+'-'+ii);
            const pmEl   = document.getElementById('plt-pm-'+ci+'-'+ii);
            const poEl   = document.getElementById('plt-po-'+ci+'-'+ii);
            if (idEl   && idEl.value.trim()) item.id = idEl.value.trim();
            if (descEl) item.descripcion = descEl.value.trim();
            if (qEl)    item.cantidad    = parseFloat(qEl.value)  || 0;
            if (uEl)    item.unidad      = uEl.value.trim() || 'GL';
            if (pmEl)   item.precioMat   = parseFloat(pmEl.value) || 0;
            if (poEl)   item.precioMO    = parseFloat(poEl.value) || 0;
        });
    });
    savePlantilla();
    toast('✅ Plantilla guardada');
}

function addPlantillaItem(ci) {
    // First save current form state
    savePlantillaForm();
    const cat = plantilla[ci];
    if (!cat) return;
    const lastId = cat.items.length > 0 ? cat.items[cat.items.length-1].id : cat.id + '.00';
    const lastNum = parseInt((lastId.split('.')[1] || '0')) || 0;
    const newNum  = String(lastNum + 1).padStart(2, '0');
    const newItem = {
        id: cat.id + '.' + newNum,
        descripcion: '',
        cantidad: 1,
        unidad: 'GL',
        precioMat: 0,
        precioMO: 0
    };
    cat.items.push(newItem);
    savePlantilla();
    // Ensure category is open
    if (!window._pltOpen) window._pltOpen = {};
    window._pltOpen[ci] = true;
    // Re-render items table
    const tableEl = document.getElementById('plt-items-'+ci);
    if (tableEl) {
        tableEl.innerHTML = plantillaItemsTable(cat, ci);
        // Focus last description input
        setTimeout(() => {
            const ii = cat.items.length - 1;
            const el = document.getElementById('plt-d-'+ci+'-'+ii);
            if (el) { el.focus(); el.select(); }
        }, 50);
    }
}

function deletePlantillaItem(ci, ii) {
    const cat = plantilla[ci];
    if (!cat) return;
    const desc = cat.items[ii]?.descripcion || 'este ítem';
    if (!confirm('¿Eliminar "' + desc + '"?')) return;
    cat.items.splice(ii, 1);
    savePlantilla();
    const tableEl = document.getElementById('plt-items-'+ci);
    if (tableEl) tableEl.innerHTML = plantillaItemsTable(cat, ci);
    toast('🗑️ Ítem eliminado');
}

function addPlantillaCategoria() {
    savePlantillaForm();
    // Use max existing numeric id + 1 to avoid collisions after deletions
    const maxNum = plantilla.reduce((mx, c) => {
        const n = parseInt(String(c.id).replace(/\D/g,'')) || 0;
        return Math.max(mx, n);
    }, 0);
    const newId = String(maxNum + 1).padStart(2, '0');
    plantilla.push({ id: newId, nombre: 'Nueva categoría', unidad: 'm²', proveedor: '', items: [] });
    savePlantilla();
    if (!window._pltOpen) window._pltOpen = {};
    window._pltOpen[plantilla.length - 1] = true;
    // Re-render accordion
    const acc = document.getElementById('plt-accordion');
    if (acc) {
        acc.innerHTML = plantilla.map((cat, ci) => plantillaCatRow(cat, ci)).join('');
        setTimeout(() => {
            const el = document.getElementById('plt-cn-' + (plantilla.length-1));
            if (el) { el.focus(); el.select(); }
        }, 50);
    }
    toast('+ Categoría agregada');
}

function deletePlantillaCategoria(ci) {
    const cat = plantilla[ci];
    if (!cat) return;
    if (!confirm('¿Eliminar la categoría "' + cat.nombre + '" y todos sus ítems?')) return;
    plantilla.splice(ci, 1);
    savePlantilla();
    const acc = document.getElementById('plt-accordion');
    if (acc) acc.innerHTML = plantilla.map((c, i) => plantillaCatRow(c, i)).join('');
    toast('🗑️ Categoría eliminada');
}

function resetPlantilla() {
    if (!confirm('¿Restaurar la plantilla original (Planilla Base MZ)? Se perderán los cambios actuales.')) return;
    plantilla = JSON.parse(JSON.stringify(PLANTILLA_BASE));
    savePlantilla();
    // Re-render
    const acc = document.getElementById('plt-accordion');
    if (acc) acc.innerHTML = plantilla.map((cat, ci) => plantillaCatRow(cat, ci)).join('');
    toast('↩ Plantilla restaurada');
}

// ─── Config: render one module row ───

    const initial = (m.name||'?').trim()[0].toUpperCase();

        <span style="display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:6px;background:${c.bg};color:${c.text};font-size:14px;font-weight:700;flex-shrink:0">${initial}</span>
        <input class="finput" id="cfg-nm-${i}" type="text" value="${esc(m.name)}"
            placeholder="Nombre del módulo" style="flex:1;font-size:15px;font-weight:500;padding:6px 10px">
        <div style="display:flex;align-items:center;gap:4px;flex-shrink:0">
            <span style="font-size:14px;color:#aaa">USD</span>
            <input class="finput" id="mc-${i}" type="number" min="0" value="${m.costUSD}"

            <span style="font-size:14px;color:#aaa">/m²</span>

        <button class="btn btn-ghost btn-sm" title="Eliminar módulo"

    </div>`;
}

// ─── Config: add new module ───
function addCfgModule() {

function statusLbl(s) {
    return { contactado:'Contactado', abierto:'Abierta', presentado:'Presentada', aprobado:'Aprobada', perdido:'Perdida' }[s] || s;
}
function tipoLbl(t) {
    return {local:'Local Comercial',oficina:'Oficina / Corp.',gastronomia:'Gastronomía',otro:'Otro'}[t] || t || '—';
}
function bHTML(s, big=false) {
    const sz = big ? 'font-size:16px;padding:6px 16px' : '';
    return `<span class="badge b-${s}" style="${sz}">${statusLbl(s)}</span>`;
}
function fileIco(n) {
    const e = (n||'').split('.').pop().toLowerCase();
    if (['jpg','jpeg','png','gif','webp'].includes(e)) return '🖼️';
    if (e==='pdf')  return '📄';
    if (['xlsx','xls','csv'].includes(e)) return '📊';
    if (['dwg','dxf'].includes(e)) return '📐';
    return '📎';
}
function fSize(b) {
    if (!b) return '';
    if (b<1024)    return b+' B';
    if (b<1048576) return Math.round(b/1024)+' KB';
    return (b/1048576).toFixed(1)+' MB';
}
function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function toast(msg) {
    document.querySelectorAll('.toast').forEach(t=>t.remove());
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(), 2800);
}

//  MAESTRO DE PRECIOS (RENDIMIENTO MATERIALES)
// ═══════════════════════════════════════════════════

async function importMaestroXlsx(input) {
    const file = input.files[0];
    if (!file) return;

    // Lazy-load SheetJS
    if (typeof XLSX === 'undefined') {
        await new Promise((res, rej) => {
            const s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
            s.onload = res; s.onerror = rej;
            document.head.appendChild(s);
        });
    }

    try {
        const buf = await file.arrayBuffer();
        const wb  = XLSX.read(buf, { type: 'array' });
        const ws  = wb.Sheets[wb.SheetNames[0]];
        const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });

        if (!raw.length) { alert('El archivo está vacío'); input.value = ''; return; }

        // ── Detectar versión (mes/año en el encabezado) ──
        let version = 'SIN FECHA';
        const MESES = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
        for (let r = 0; r < Math.min(6, raw.length); r++) {
            const row = raw[r] || [];
            for (const cell of row) {
                if (typeof cell !== 'string') continue;
                const m = cell.toUpperCase().match(new RegExp('(' + MESES.join('|') + ')\\s*\\d{4}'));
                if (m) { version = m[0]; break; }
            }
            if (version !== 'SIN FECHA') break;
        }

        // ── Detectar columna "precio unitario" escaneando primeras filas ──
        let colPrecio = -1;
        for (let r = 0; r < Math.min(10, raw.length); r++) {
            const row = raw[r] || [];
            for (let c = 0; c < row.length; c++) {
                const cell = typeof row[c] === 'string' ? row[c].toLowerCase().trim() : '';
                if (cell.includes('precio unitario') || cell === 'p.u.' || cell === 'precio u') {
                    colPrecio = c; break;
                }
            }
            if (colPrecio >= 0) break;
        }

        // ── Parsear filas ──
        const rubros = [];
        let currentRubro = null;
        let totalItems   = 0;

        for (let r = 0; r < raw.length; r++) {
            const row = raw[r];
            if (!row) continue;

            const codRaw  = row[1];
            const descRaw = row[2];
            const unitRaw = row[4];

            if (!descRaw || typeof descRaw !== 'string' || !descRaw.trim()) continue;

            const cod  = codRaw !== null && codRaw !== undefined ? String(codRaw).trim() : '';
            const desc = descRaw.trim();
            const unit = unitRaw ? String(unitRaw).trim() : '';

            // Ítem: tiene código con punto decimal o letra+punto (1.1, C.01, R.02)
            const isItem = unit && cod && /^\d+\.\d+$|^[A-Za-z]\.\d+$/.test(cod);

            if (!isItem) {
                // Fila de rubro/sección (sin unidad o sin código decimal)
                if (desc && desc.length > 2 && !desc.startsWith('PRECIOS') && !desc.startsWith('KG') && !desc.startsWith('BOLSA') && !desc.startsWith('CANT')) {
                    currentRubro = { nombre: desc, items: [] };
                    rubros.push(currentRubro);
                }
                continue;
            }

            if (!currentRubro) { currentRubro = { nombre: 'General', items: [] }; rubros.push(currentRubro); }

            // Obtener precio ARS: usar colPrecio detectado, o buscar en últimas 6 columnas el mayor valor
            let precioARS = 0;
            if (colPrecio >= 0 && colPrecio < row.length) {
                precioARS = parseFloat(row[colPrecio]) || 0;
            }
            if (!precioARS || precioARS < 1) {
                // Fallback: escanear últimas 6 columnas buscando el mayor valor numérico > 100
                const end = row.length;
                for (let ci = end - 6; ci < end; ci++) {
                    const v = parseFloat(row[ci]);
                    if (v > 100 && v > precioARS) precioARS = v;
                }
            }

            if (precioARS > 0) {
                currentRubro.items.push({
                    cod,
                    desc,
                    unit,
                    precioARS: Math.round(precioARS * 100) / 100
                });
                totalItems++;
            }
        }

        // Filtrar rubros vacíos
        const filteredRubros = rubros.filter(r => r.items.length > 0);

        if (!totalItems) { alert('No se encontraron ítems con precios en el archivo. Verificá que sea el archivo RENDIMIENTO MATERIALES correcto.'); input.value = ''; return; }

        master = {
            version,
            loadedAt: new Date().toLocaleDateString('es-AR'),
            totalItems,
            rubros: filteredRubros
        };
        saveMaster();

        toast(`✓ Maestro cargado: ${version} · ${totalItems} ítems en ${filteredRubros.length} rubros`);
        const _appEl = document.getElementById('app'); if (_appEl) _appEl.innerHTML = vConfig();
    } catch (e) {
        console.error(e);
        alert('Error al procesar el archivo: ' + e.message);
    }
    input.value = '';
}

function vMaestroResults(modId, q, rubroIdx) {
    const tc    = cfg.usdArs || 1250;
    const rubros = (rubroIdx >= 0) ? [master.rubros[rubroIdx]] : master.rubros;
    const rows  = [];

    for (const rubro of rubros) {
        let items = rubro.items;
        if (q) items = items.filter(it => it.desc.toLowerCase().includes(q) || it.cod.toLowerCase().includes(q));
        if (!items.length) continue;

        rows.push(`<div style="padding:5px 24px 3px;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#aaa;background:#fafafa;border-bottom:1px solid #f0f0f0">${esc(rubro.nombre)}</div>`);

        for (const item of items) {
            const usd = item.precioARS / tc;
            const codEsc  = esc(item.cod);
            const descEsc = esc(item.desc);
            const unitEsc = esc(item.unit);
            rows.push(`
            <div onclick="selectMaestroItem('${modId}','${codEsc}','${descEsc}','${unitEsc}',${item.precioARS})"
                style="padding:9px 24px;cursor:pointer;border-bottom:1px solid #f5f5f5;display:grid;grid-template-columns:80px 1fr 60px 110px 100px;gap:10px;align-items:center;transition:background .1s"
                onmouseover="this.style.background='#f0f9ff'" onmouseout="this.style.background=''">
                <div style="font-family:monospace;font-size:12px;font-weight:700;color:#6366f1">${codEsc}</div>
                <div style="font-size:13px;font-weight:500;color:#111;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${descEsc}">${descEsc}</div>
                <div style="font-size:13px;color:#777;text-align:center">${unitEsc}</div>
                <div style="font-size:13px;color:#555;text-align:right">$ ${item.precioARS.toLocaleString('es-AR',{maximumFractionDigits:0})}</div>
                <div style="font-size:13px;font-weight:700;color:#2563eb;text-align:right">${fUSD(usd)}</div>
            </div>`);
        }
    }

    if (!rows.length) {
        return `<div style="padding:48px;text-align:center;color:#bbb;font-size:14px">
            ${q ? `Sin resultados para "<strong>${esc(q)}</strong>"` : 'Sin ítems en este rubro'}
        </div>`;
    }
    return rows.join('');
}

function selectMaestroItemDet(presupId, modId, cod, desc, unit, precioARS) {
    const pi  = plist.findIndex(p => p.id === presupId);
    if (pi < 0) { closeMaestroModal(); return; }
    const p   = plist[pi];
    const tc  = p.usdArs || cfg.usdArs || 1250;
    const isARS = (p.moneda||'USD') === 'ARS';
    const price = isARS ? precioARS : Math.round((precioARS / tc) * 100) / 100;

    const newItem = {
        id:         Date.now().toString(36) + Math.random().toString(36).slice(2,5),
        cod,
        desc,
        qty:        1,
        unit,
        priceMat:   price,
        priceMO:    0,
        fromMaster: master.version
    };

    const mod = (p.modules||[]).find(m => m.id === modId);

async function importPlantillaXlsx(input) {
    const file = input.files[0];
    if (!file) return;
    input.value = '';

    // Lazy-load SheetJS
    if (!window.XLSX) {
        await new Promise((res, rej) => {
            const s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
            s.onload = res; s.onerror = rej;
            document.head.appendChild(s);
        });
    }

    const buf  = await file.arrayBuffer();
    const wb   = window.XLSX.read(buf, { type: 'array' });
    const ws   = wb.Sheets[wb.SheetNames[0]];
    const data = window.XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

    // Detect header row and columns (same logic as parseXlsFile)
    let startIdx = 0;
    let colRubro = -1, colCod = -1, colDesc = 0, colQty = 1, colUnit = 2, colMat = 3, colMO = 4;

    for (let i = 0; i < Math.min(data.length, 6); i++) {
        const row = data[i].map(c => String(c).toLowerCase().trim());
        const hasHeader = row.some(c => ['desc','concepto','rubro','descripcion','descripción'].some(k => c.includes(k)));
        if (hasHeader) {
            startIdx = i + 1;
            row.forEach((c, idx) => {
                if (['rubro','modulo','módulo','categoria','categoría'].some(k => c === k || c.startsWith(k))) colRubro = idx;
                else if (['cod','codigo','código'].some(k => c.includes(k)))                                   colCod   = idx;
                else if (['desc','concepto','detalle','nombre'].some(k => c.includes(k)))                      colDesc  = idx;
                else if (['cant','qty','cantidad'].some(k => c.includes(k)))                                   colQty   = idx;
                else if (['unid','unit','und'].some(k => c.includes(k)))                                       colUnit  = idx;
                else if (['pu.mat','p.mat','mat','precio mat'].some(k => c.includes(k)))                       colMat   = idx;
                else if (['pmo','p.mo','mano','mo'].some(k => c.includes(k)))                                  colMO    = idx;
            });
            break;
        }
    }

    // Parse rows
    const parsed = [];
    for (let i = startIdx; i < data.length; i++) {
        const row  = data[i];
        if (!row || !row.length) continue;
        const desc = String(row[colDesc] || '').trim();
        if (!desc || desc.startsWith('Unidades válidas')) continue;
        const rubro   = colRubro >= 0 ? String(row[colRubro] || '').trim() : '';
        const cod     = colCod   >= 0 ? String(row[colCod]   || '').trim() : '';
        const qty     = parseFloat(String(row[colQty]  || '1').replace(',','.')) || 1;
        const rawUnit = String(row[colUnit] || '').trim().toLowerCase();
        const unit    = rawUnit || 'GL';
        const pMat    = parseFloat(String(row[colMat]  || '0').replace(',','.').replace(/[^0-9.]/g,'')) || 0;
        const pMO     = parseFloat(String(row[colMO]   || '0').replace(',','.').replace(/[^0-9.]/g,'')) || 0;
        if (rubro) parsed.push({ rubro, cod, desc, qty, unit, pMat, pMO });
    }

    if (!parsed.length) { toast('⚠️ No se encontraron ítems en el Excel'); return; }

    // Group by rubro
    const byRubro = {};
    parsed.forEach(r => {
        const key = r.rubro.toLowerCase();
        if (!byRubro[key]) byRubro[key] = { rubroName: r.rubro, rows: [] };
        byRubro[key].rows.push(r);
    });

    let updated = 0, created = 0;
    Object.values(byRubro).forEach(({ rubroName, rows }) => {
        const key = rubroName.toLowerCase();
        let cat = plantilla.find(c => c.nombre.toLowerCase() === key);
        if (!cat) {
            // Create new category
            const maxNum = plantilla.reduce((mx, c) => Math.max(mx, parseInt(String(c.id).replace(/\D/g,'')) || 0), 0);
            const newId  = String(maxNum + 1).padStart(2, '0');
            cat = { id: newId, nombre: rubroName, unidad: 'm²', proveedor: '', items: [] };
            plantilla.push(cat);
            created++;
        } else {
            updated++;
        }
        // Replace items from Excel (preserves manual additions not in the file — merge by cod/desc)
        rows.forEach(r => {
            const existing = cat.items.find(it => (r.cod && it.id === r.cod) || it.descripcion.toLowerCase() === r.desc.toLowerCase());
            if (existing) {
                // Update prices
                existing.precioMat = r.pMat;
                existing.precioMO  = r.pMO;
                existing.cantidad  = r.qty;
                existing.unidad    = r.unit || existing.unidad;
            } else {
                cat.items.push({
                    id:          r.cod || (cat.id + '.' + String(cat.items.length + 1).padStart(2,'0')),
                    descripcion: r.desc,
                    cantidad:    r.qty,
                    unidad:      r.unit,
                    precioMat:   r.pMat,
                    precioMO:    r.pMO
                });
            }
        });
    });

    savePlantilla();
    // Re-render accordion
    const acc = document.getElementById('plt-accordion');
    if (acc) acc.innerHTML = plantilla.map((cat, ci) => plantillaCatRow(cat, ci)).join('');
    toast(`✅ Plantilla actualizada — ${updated} rubros actualizados, ${created} creados`);
}

                cat.nombre,
                item.id || (cat.id + '-' + String(ii+1).padStart(3,'0')),
                item.descripcion || '',
                item.cantidad || 1,
                item.unidad || 'm²',
                0,
                0,
                ''
            ]);
            ir.height = 16;
            ir.eachCell((cell, cn) => {
                cell.style = {
                    font:  { size:10 },
                    fill:  { type:'pattern', pattern:'solid', fgColor:{ argb: isAlt ? 'FFEFEFEF' : 'FFFFFFFF' } },
                    border:{ left:{ style:'medium', color:{ argb: argb(pal.border) } }, bottom:{ style:'hair', color:{argb:'FFEEEEEE'} } },
                    alignment: { horizontal: cn >= 4 && cn <= 7 ? 'center' : 'left', vertical:'middle' }
                };
                if (cn >= 6 && cn <= 7) {
                    cell.numFmt = '#,##0.00';
                }
            });
            rowCount++;
        });
    });

    // ── Fila referencia de unidades ────────────────
    ws.addRow([]);
    const refRow = ws.addRow(['Unidades válidas: m² · m³ · ml · un · gl · hs · kg · lote']);
    ws.mergeCells(refRow.number, 1, refRow.number, 8);
    refRow.height = 16;
    refRow.getCell(1).style = {
        font:      { italic:true, size:9, color:{ argb:'FF888888' } },
        fill:      { type:'pattern', pattern:'solid', fgColor:{ argb:'FFF9F9F9' } },
        alignment: { horizontal:'left', vertical:'middle' }
    };

    // ── Freezar fila de encabezados ─────────────────
    ws.views = [{ state:'frozen', ySplit:4 }];

    // ── Descargar ──────────────────────────────────
    const buf  = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = 'MZ_Plantilla_Rubros.xlsx';
    a.click();
    URL.revokeObjectURL(url);
    toast('✅ Plantilla descargada');
}

// ═══════════════════════════════════════════════════
//  EXCEL EXPORT
// ═══════════════════════════════════════════════════
async function exportExcel(presupId) {
    const p = plist.find(x => x.id === presupId);
    if (!p) return;

    toast('⏳ Generando Excel…');

    // Lazy-load ExcelJS
    if (!window.ExcelJS) {
        await new Promise((res, rej) => {
            const sc = document.createElement('script');
            sc.src = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
            sc.onload = res; sc.onerror = rej;
            document.head.appendChild(sc);
        });
    }

    const wb   = new ExcelJS.Workbook();
    wb.creator = 'MZ Latam';
    wb.created = new Date();
    const tc      = p.usdArs || cfg.usdArs;
    const xlMoneda = p.moneda || 'USD';
    // Recalculate sub from items on-the-fly so export is never empty due to a stale stored value
    const mods = (p.modules || [])
        .filter(m => m.on !== false)
        .map(m => {
            const sub = m.mode === 'items'
                ? (m.items||[]).reduce((s,it) => s + (parseFloat(it.qty)||0)*((parseFloat(it.priceMat??it.priceUSD??0)||0)+(parseFloat(it.priceMO)||0)), 0)
                : (parseFloat(m.costUSD)||0) * (parseFloat(p.metros)||0);
            return { ...m, sub };
        })
        .filter(m => m.sub > 0 || (m.items||[]).length > 0);
    const asg  = p.assignedTo ? (getUser(p.assignedTo)?.name || '—') : '—';

    const stripEmoji = str => String(str||'').replace(/[\u{1F000}-\u{1FFFF}]|[\u{2600}-\u{27BF}]|[\u{FE00}-\u{FEFF}]|[\u{1F300}-\u{1F9FF}]/gu, '').trim();
    const argb  = hex => 'FF' + hex.replace('#','').toUpperCase();
    const fmtN  = (v, isusd) => isusd ? 'USD #,##0' : '$ #,##0';
    const fv    = v => parseFloat(v)||0;

    // Style helpers
    const titleStyle = bg => ({
        font:      { bold:true, size:13, color:{ argb:'FFFFFFFF' } },
        fill:      { type:'pattern', pattern:'solid', fgColor:{ argb: bg || 'FF0A0A0A' } },
        alignment: { horizontal:'left', vertical:'middle' }
    });
    const modHeaderStyle = (c) => ({
        font:      { bold:true, size:11, color:{ argb: argb(c.text) } },
        fill:      { type:'pattern', pattern:'solid', fgColor:{ argb: argb(c.bg) } },
        border:    { left:{ style:'medium', color:{ argb: argb(c.border) } } },
        alignment: { vertical:'middle' }
    });
    const colHeaderStyle = (c) => ({
        font:      { bold:true, size:10, color:{ argb:'FF444444' } },
        fill:      { type:'pattern', pattern:'solid', fgColor:{ argb:'FFF5F5F5' } },
        border: {
            bottom: { style:'thin', color:{ argb:'FFD0D0D0' } },
            left:   { style:'medium', color:{ argb: argb(c.border) } }
        },
        alignment: { horizontal:'center', vertical:'middle' }
    });
    const itemStyle = (c, isAlt) => ({
        fill:   { type:'pattern', pattern:'solid', fgColor:{ argb: isAlt ? 'FFF9F9F9' : 'FFFFFFFF' } },
        border: { left:{ style:'medium', color:{ argb: argb(c.border) } }, bottom:{ style:'hair', color:{argb:'FFEEEEEE'} } },
        alignment: { vertical:'middle' }
    });
    const subtotalStyle = (c) => ({
        font:   { bold:true, size:10, color:{ argb: argb(c.text) } },
        fill:   { type:'pattern', pattern:'solid', fgColor:{ argb: argb(c.bg) } },
        border: { left:{ style:'medium', color:{ argb: argb(c.border) } }, top:{ style:'thin', color:{ argb: argb(c.border) } } }
    });
    const provHeaderStyle = { font:{ italic:true, size:9, color:{argb:'FF777777'} }, fill:{ type:'pattern', pattern:'solid', fgColor:{argb:'FFF8F8F8'} } };
    const provRowStyle    = { font:{ size:10 }, fill:{ type:'pattern', pattern:'solid', fgColor:{argb:'FFFAFAFA'} } };
    const totalStyle = {
        font:   { bold:true, size:11, color:{ argb:'FF0A0A0A' } },
        fill:   { type:'pattern', pattern:'solid', fgColor:{ argb:'FFF0F0F0' } },
        border: { top:{ style:'double', color:{argb:'FF0A0A0A'} } }
    };
    const infoLabelStyle = { font:{ bold:true, size:10, color:{argb:'FF555555'} }, fill:{ type:'pattern', pattern:'solid', fgColor:{argb:'FFF5F5F5'} } };
    const infoValStyle   = { font:{ size:10 }, alignment:{ wrapText:true } };

    const applyStyle = (row, styleObj) => {
        row.eachCell({ includeEmpty:true }, cell => { Object.assign(cell, styleObj); });
        row.height = 18;
    };
    const applyStyleCols = (row, styles) => {
        styles.forEach(([colIdx, styleObj]) => {
            const cell = row.getCell(colIdx);
            Object.assign(cell, styleObj);
        });
    };

    // ── HOJA 1: RESUMEN ──────────────────────────────
    const ws1 = wb.addWorksheet('Resumen');
    ws1.columns = [
        {key:'a', width:28}, {key:'b', width:28}, {key:'c', width:4},
        {key:'d', width:20}, {key:'e', width:28}, {key:'f', width:18}, {key:'g', width:18}
    ];

    // Title
    const t1 = ws1.addRow(['MZ LATAM — PRESUPUESTO #' + p.num]);
    ws1.mergeCells(t1.number, 1, t1.number, 7);
    t1.height = 28;
    t1.getCell(1).style = { font:{bold:true,size:14,color:{argb:'FFFFFFFF'}}, fill:{type:'pattern',pattern:'solid',fgColor:{argb:'FF0A0A0A'}}, alignment:{horizontal:'left',vertical:'middle'} };

    ws1.addRow([]);

    // Project info block
    const infoRows = [
        ['Cliente', p.cliente, '', 'Proyecto', p.proyecto],
        ['Tipo', tipoLbl(p.tipo), '', 'Ubicacion', p.ubicacion||'—'],
        ['Lider de proyecto', asg, '', 'Estado', statusLbl(p.status)],
        ['FIL', fDate(p.fecha), '', 'TC', '1 USD = ARS ' + fmt(tc)],
        ['Margen MZ', (p.margen||cfg.margen) + '%', '', 'Metros cuadrados', (p.metros||0) + ' m2'],
    ];
    infoRows.forEach(data => {
        const r = ws1.addRow(data);
        r.height = 17;
        r.getCell(1).style = infoLabelStyle;
        r.getCell(2).style = infoValStyle;
        r.getCell(4).style = infoLabelStyle;
        r.getCell(5).style = infoValStyle;
    });

    ws1.addRow([]);

    // Desglose header
    const dh = ws1.addRow(['Modulo','Items','Total USD','Total ARS','Proveedor asignado','Estado','Monto cotizado']);
    dh.height = 17;
    dh.eachCell(cell => {
        cell.style = { font:{bold:true,size:10,color:{argb:'FFFFFFFF'}}, fill:{type:'pattern',pattern:'solid',fgColor:{argb:'FF333333'}}, alignment:{horizontal:'center',vertical:'middle'} };
    });
    dh.getCell(1).alignment = { horizontal:'left', vertical:'middle' };

    mods.forEach((m, i) => {
        const c = MOD_PALETTE[i % MOD_PALETTE.length];
        const pv = (m.proveedores||[])[0];
        const mSubUSD = xlMoneda==='ARS' ? fv(m.sub)/tc : fv(m.sub);
        const mSubARS = xlMoneda==='ARS' ? fv(m.sub)    : fv(m.sub)*tc;
        const r = ws1.addRow([
            stripEmoji(m.name),
            m.mode === 'items' ? (m.items||[]).length : '—',
            mSubUSD,
            mSubARS,
            pv?.supplierName || '—',
            pv ? (ESTADOS_PROV.find(e=>e.id===pv.estado)?.label||pv.estado) : '—',
            pv?.monto ? fv(pv.monto) : '—',
        ]);
        r.height = 17;
        r.getCell(1).style = { font:{bold:true,size:10,color:{argb:argb(c.text)}}, fill:{type:'pattern',pattern:'solid',fgColor:{argb:argb(c.bg)}}, border:{left:{style:'medium',color:{argb:argb(c.border)}}} };
        [2,3,4,5,6,7].forEach(col => {
            r.getCell(col).style = { fill:{type:'pattern',pattern:'solid',fgColor:{argb:argb(c.bg)}}, font:{size:10} };
        });
        r.getCell(3).numFmt = '"USD "#,##0';
        r.getCell(4).numFmt = '"$ "#,##0';
        if (pv?.monto) r.getCell(7).numFmt = pv.moneda==='USD' ? '"USD "#,##0' : '"$ "#,##0';
    });

    ws1.addRow([]);
    // totalUSD/ARS = precio al cliente (base + MG%); derivamos costo base
    const xlMG      = (p.margen || cfg.margen || 10) / 100;
    const xlClientUSD = fv(p.totalUSD);
    const xlClientARS = fv(p.totalARS);
    const xlCostoUSD  = fv(p.totalUSD / (1 + xlMG));
    const xlCostoARS  = fv(p.totalARS / (1 + xlMG));
    const xlGananciaUSD = fv(p.totalUSD - p.totalUSD / (1 + xlMG));
    const xlGananciaARS = fv(p.totalARS - p.totalARS / (1 + xlMG));
    const tot1 = ws1.addRow(['COSTO BASE MZ',                                                  '', xlCostoUSD,    xlCostoARS]);
    const tot2 = ws1.addRow(['PRECIO AL CLIENTE  (+'+ (p.margen||cfg.margen) +'%)',            '', xlClientUSD,   xlClientARS]);
    const tot3 = ws1.addRow(['GANANCIA MZ',                                                    '', xlGananciaUSD, xlGananciaARS]);
    [tot1,tot2,tot3].forEach((r,i) => {
        r.height = 18;
        r.getCell(1).style = totalStyle;
        r.getCell(3).style = { ...totalStyle, numFmt:'"USD "#,##0', font:{bold:true,size:11} };
        r.getCell(4).style = { ...totalStyle, numFmt:'"$ "#,##0', font:{bold:true,size:11} };
    });
    tot2.getCell(1).style = { ...totalStyle, fill:{type:'pattern',pattern:'solid',fgColor:{argb:'FFE8F5E9'}}, font:{bold:true,size:11,color:{argb:'FF15803D'}} };
    tot2.getCell(3).style = { font:{bold:true,size:11,color:{argb:'FF15803D'}}, numFmt:'"USD "#,##0' };
    tot2.getCell(4).style = { font:{bold:true,size:11,color:{argb:'FF15803D'}}, numFmt:'"$ "#,##0' };

    if (p.notas) { ws1.addRow([]); ws1.addRow(['Notas:', stripEmoji(p.notas)]); }

    // ── HOJA 2: DETALLE POR MODULO ────────────────────
    const ws2 = wb.addWorksheet('Detalle Modulos');
    ws2.columns = [
        {key:'a',width:10},{key:'b',width:36},{key:'c',width:8},
        {key:'d',width:9},{key:'e',width:14},{key:'f',width:14},{key:'g',width:15},{key:'h',width:15}
    ];

    const t2 = ws2.addRow(['MZ LATAM — DETALLE DE MODULOS — PRESUPUESTO #' + p.num]);
    ws2.mergeCells(t2.number,1,t2.number,8);
    t2.height = 26;
    t2.getCell(1).style = { font:{bold:true,size:13,color:{argb:'FFFFFFFF'}}, fill:{type:'pattern',pattern:'solid',fgColor:{argb:'FF0A0A0A'}}, alignment:{horizontal:'left',vertical:'middle'} };

    const t2b = ws2.addRow(['Cliente: ' + p.cliente + '   |   Proyecto: ' + p.proyecto + '   |   TC: 1 USD = ARS ' + fmt(tc)]);
    ws2.mergeCells(t2b.number,1,t2b.number,8);
    t2b.height = 16;
    t2b.getCell(1).style = { font:{italic:true,size:10,color:{argb:'FF666666'}}, fill:{type:'pattern',pattern:'solid',fgColor:{argb:'FFF5F5F5'}} };

    mods.forEach((m, mi) => {
        const c   = MOD_PALETTE[mi % MOD_PALETTE.length];
        const num = mi + 1;

        ws2.addRow([]);

        // Module header
        const mhRow = ws2.addRow([num + '.', stripEmoji(m.name).toUpperCase()]);
        ws2.mergeCells(mhRow.number, 2, mhRow.number, 8);
        mhRow.height = 20;
        mhRow.getCell(1).style = modHeaderStyle(c);
        mhRow.getCell(2).style = { ...modHeaderStyle(c), font:{bold:true,size:11,color:{argb:argb(c.text)}} };

        // Column headers
        const secMoneda = xlMoneda === 'ARS' ? 'USD' : 'ARS';
        const chRow = ws2.addRow(['Item','Descripcion','Cant.','Unidad',`P.Mat ${xlMoneda}`,`P.MO ${xlMoneda}`,`Subtotal ${xlMoneda}`,`Subtotal ${secMoneda}`]);
        chRow.height = 16;
        chRow.eachCell(cell => { cell.style = colHeaderStyle(c); });

        const priNFmt = xlMoneda==='ARS' ? '"$ "#,##0'   : '"USD "#,##0';
        const secNFmt = xlMoneda==='ARS' ? '"USD "#,##0' : '"$ "#,##0';
        const qtyFmt  = '#,##0';   // cantidades: sin símbolo de moneda

        if (m.mode === 'items' && m.items?.length > 0) {
            m.items.forEach((item, ii) => {
                const pm     = fv(item.priceMat ?? item.priceUSD ?? 0);
                const pmo    = fv(item.priceMO);
                const sub    = fv(item.qty) * (pm + pmo);
                const subSec = xlMoneda==='ARS' ? sub/tc : sub*tc;
                const st = itemStyle(c, ii%2===1);
                const stC = { ...st, alignment:{ horizontal:'center', vertical:'middle' } };
                const ir  = ws2.addRow([num + '.' + (ii+1), stripEmoji(item.desc||'—'), fv(item.qty), item.unit||'', pm, pmo, fv(sub), subSec]);
                ir.height = 16;
                ir.getCell(1).style = st;
                ir.getCell(2).style = st;
                ir.getCell(3).style = { ...stC, numFmt: qtyFmt  };
                ir.getCell(4).style = stC;
                ir.getCell(5).style = { ...st,  numFmt: priNFmt };
                ir.getCell(6).style = { ...st,  numFmt: priNFmt };
                ir.getCell(7).style = { ...st,  numFmt: priNFmt };
                ir.getCell(8).style = { ...st,  numFmt: secNFmt };
            });
        } else {
            const sub0 = fv(m.sub);

            const st0  = itemStyle(c, false);

            const ir = ws2.addRow([num+'.1', stripEmoji(m.name), fv(p.metros), 'm2', fv(m.costUSD||0), 0, sub0, sec0]);

            ir.getCell(1).style = st0;
            ir.getCell(2).style = st0;
            ir.getCell(3).style = { ...stC0, numFmt: qtyFmt  };
            ir.getCell(4).style = stC0;
            ir.getCell(5).style = { ...st0,  numFmt: priNFmt };
            ir.getCell(6).style = { ...st0,  numFmt: priNFmt };
            ir.getCell(7).style = { ...st0,  numFmt: priNFmt };
            ir.getCell(8).style = { ...st0,  numFmt: secNFmt };
        }

        // Subtotal row
        const secSub = xlMoneda==='ARS' ? fv(m.sub)/tc : fv(m.sub)*tc;
        const sr = ws2.addRow(['','SUBTOTAL ' + stripEmoji(m.name).toUpperCase(),'','','','',fv(m.sub),secSub]);
        sr.height = 17;
        const sst = subtotalStyle(c);
        sr.eachCell(cell => { cell.style = sst; });

            nr.getCell(2).style = { font:{italic:true,size:9,color:{argb:'FF888888'}} };
        }
    });

    ws2.addRow([]);
    // totalUSD/ARS = precio al cliente (base + MG%); loUSD/hiUSD = ±10% rango estimación
    const gt2MG  = (p.margen || cfg.margen || 10) / 100;
    const gt2Costo = xlMoneda==='ARS' ? fv(p.totalARS/(1+gt2MG)) : fv(p.totalUSD/(1+gt2MG));
    const gt2CostoSec = xlMoneda==='ARS' ? fv(p.totalUSD/(1+gt2MG)) : fv(p.totalARS/(1+gt2MG));

    const gt0 = ws2.addRow(['','COSTO BASE (sin MG)','','','','', gt2Costo, gt2CostoSec]);
    const gt1 = ws2.addRow(['','PRECIO AL CLIENTE  (+'+(p.margen||cfg.margen)+'% MG)','','','','',
        xlMoneda==='ARS' ? fv(p.totalARS) : fv(p.totalUSD),
        xlMoneda==='ARS' ? fv(p.totalUSD) : fv(p.totalARS)]);
    const gt2 = ws2.addRow(['','ESTIMADO RANGO  (precio ±10%)','','','','',
        xlMoneda==='ARS' ? fv(p.loUSD*tc) + ' — ' + fv(p.hiUSD*tc) : fv(p.loUSD) + ' — ' + fv(p.hiUSD),
        '']);
    [gt0,gt1,gt2].forEach(r => {
        r.height = 18;
        const gtSt = totalStyle;
        r.eachCell(cell => { cell.style = gtSt; });
        r.getCell(7).style = { ...gtSt, numFmt: xlMoneda==='ARS' ? '"$ "#,##0' : '"USD "#,##0' };
        r.getCell(8).style = { ...gtSt, numFmt: xlMoneda==='ARS' ? '"USD "#,##0' : '"$ "#,##0' };
    });
    gt1.getCell(2).style = { ...totalStyle, fill:{type:'pattern',pattern:'solid',fgColor:{argb:'FFE8F5E9'}}, font:{bold:true,size:11,color:{argb:'FF15803D'}} };
    gt1.getCell(7).style = { ...totalStyle, numFmt: xlMoneda==='ARS' ? '"$ "#,##0' : '"USD "#,##0', font:{bold:true,size:11,color:{argb:'FF15803D'}} };
    gt1.getCell(8).style = { ...totalStyle, numFmt: xlMoneda==='ARS' ? '"USD "#,##0' : '"$ "#,##0', font:{bold:true,size:11,color:{argb:'FF15803D'}} };

    // ── HOJA 3: RESUMEN PROVEEDORES ──────────────────
    const ws3 = wb.addWorksheet('Resumen Proveedores');
    ws3.columns = [
        {key:'a',width:22},{key:'b',width:26},{key:'c',width:18},
        {key:'d',width:16},{key:'e',width:20},{key:'f',width:10},{key:'g',width:30}

    const t3 = ws3.addRow(['MZ LATAM — RESUMEN PROVEEDORES — PRESUPUESTO #' + p.num]);

    ws3.mergeCells(t3b.number,1,t3b.number,7);
    t3b.getCell(1).style = { font:{italic:true,size:10,color:{argb:'FF666666'}}, fill:{type:'pattern',pattern:'solid',fgColor:{argb:'FFF5F5F5'}} };

    ws3.addRow([]);
    const ph = ws3.addRow(['Modulo','Proveedor','Contacto','Estado','Presupuesto original','Moneda','Nota / Plazo']);
    ph.height = 16;
    ph.eachCell(cell => { cell.style = { font:{bold:true,size:10,color:{argb:'FFFFFFFF'}}, fill:{type:'pattern',pattern:'solid',fgColor:{argb:'FF333333'}}, alignment:{horizontal:'center',vertical:'middle'} }; });
    ph.getCell(1).alignment = { horizontal:'left', vertical:'middle' };

    mods.forEach((m, i) => {
        const c = MOD_PALETTE[i % MOD_PALETTE.length];
        const provs = m.proveedores || [];
        if (provs.length === 0) {
            const r = ws3.addRow([stripEmoji(m.name),'Sin proveedor asignado','—','—','—','—','—']);
            r.height = 16;
            r.getCell(1).style = { font:{bold:true,size:10,color:{argb:argb(c.text)}}, fill:{type:'pattern',pattern:'solid',fgColor:{argb:argb(c.bg)}}, border:{left:{style:'medium',color:{argb:argb(c.border)}}} };
        } else {
            provs.forEach((pv, pi) => {
                const sup = getSupplier(pv.supplierId);
                const r = ws3.addRow([
                    pi===0 ? stripEmoji(m.name) : '',
                    pv.supplierName||'—',
                    sup?.contacto || sup?.tel || '—',
                    ESTADOS_PROV.find(e=>e.id===pv.estado)?.label || pv.estado,
                    pv.monto ? fv(pv.monto) : '—',
                    pv.moneda||'ARS',
                    (pv.plazo?fDate(pv.plazo):'—') + (pv.nota?' — '+stripEmoji(pv.nota):''),
                ]);
                r.height = 16;
                r.getCell(1).style = { font:{bold:true,size:10,color:{argb:argb(c.text)}}, fill:{type:'pattern',pattern:'solid',fgColor:{argb:argb(c.bg)}}, border:{left:{style:'medium',color:{argb:argb(c.border)}}} };
                [2,3,4,5,6,7].forEach(col => { r.getCell(col).style = { fill:{type:'pattern',pattern:'solid',fgColor:{argb:argb(c.bg)}}, font:{size:10} }; });
                if (pv.monto) r.getCell(5).numFmt = pv.moneda==='USD'?'"USD "#,##0':'"$ "#,##0';
            });
        }
    });

    ws3.addRow([]);
    const ws3MG    = (p.margen || cfg.margen || 10) / 100;
    const ws3Costo = fv(p.totalUSD / (1 + ws3MG));
    const st1 = ws3.addRow(['COSTO BASE MZ','','','',ws3Costo,'USD','']);
    const st2 = ws3.addRow(['PRECIO AL CLIENTE (+'+(p.margen||cfg.margen)+'%)','','','',fv(p.totalUSD),'USD','']);
    [st1,st2].forEach(r => {
        r.height = 18;
        r.eachCell(cell => { cell.style = totalStyle; });
        r.getCell(5).numFmt = '"USD "#,##0';
    });

    // ── DESCARGA ──────────────────────────────────────
    const safeName = (p.cliente||'Cliente').replace(/[^a-z0-9áéíóúüñ ]/gi,'').trim().replace(/\s+/g,'_');
    const filename = `MZ_Presupuesto_${String(p.num).padStart(3,'0')}_${safeName}.xlsx`;
    const buffer = await wb.xlsx.writeBuffer();
    const blob   = new Blob([buffer], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url    = URL.createObjectURL(blob);
    const a      = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
    toast('Excel generado: ' + filename);
}

function renderPLChart(presupId) {
    const p = plist.find(x => x.id === presupId);
    if (!p) return;
    const canvas = document.getElementById('pl-chart-' + presupId);
    const legend = document.getElementById('pl-legend-' + presupId);
    if (!canvas || !legend) return;

    const tryRender = () => {
        if (typeof Chart === 'undefined') { setTimeout(tryRender, 150); return; }
        const mods   = (p.modules || []).filter(m => m.on !== false && m.sub > 0);
        const total  = priAmtP(p) || 0;
        const colors = ['#7c3aed','#0284c7','#16a34a','#ca8a04','#dc2626','#db2777','#ea580c','#0ea5e9'];

        // Destroy existing chart on this canvas if any
        const existing = Chart.getChart(canvas);
        if (existing) existing.destroy();

        new Chart(canvas, {
            type: 'doughnut',
            data: {
                labels: mods.map(m => m.name),
                datasets: [{
                    data: mods.map(m => m.sub),
                    backgroundColor: colors.slice(0, mods.length),
                    borderWidth: 3,
                    borderColor: '#fff',
                    hoverOffset: 8
                }]
            },
            options: {
                responsive: false,
                cutout: '58%',
                plugins: {
                    legend: { display: false },
                    tooltip: { callbacks: {
                        label: ctx => '  ' + ctx.label + ': ' + fPriP(ctx.raw, p) + ' (' + (total > 0 ? Math.round(ctx.raw / total * 100) : 0) + '%)'
                    }}
                }
            }
        });

        legend.innerHTML = mods.map((m, i) => {
            const pct = total > 0 ? Math.round(m.sub / total * 100) : 0;
            return '<div style="display:flex;align-items:center;gap:10px">' +
                '<span style="width:13px;height:13px;border-radius:3px;flex-shrink:0;background:' + colors[i % colors.length] + '"></span>' +
                '<div style="flex:1;min-width:0">' +
                    '<div style="font-size:14px;font-weight:600">' + esc(m.name) + '</div>' +
                    '<div style="font-size:13px;color:#666">' + fPriP(m.sub, p) + ' &nbsp;·&nbsp; <strong>' + pct + '%</strong></div>' +
                '</div></div>';
        }).join('');
    };
    tryRender();
}

function saveEditInfo(presupId) {
    const idx = plist.findIndex(x => x.id === presupId);
    if (idx === -1) return;
    const cli = document.getElementById('eim-cli').value.trim();
    const pro = document.getElementById('eim-pro').value.trim();
    if (!cli || !pro) { toast('❌ Cliente y Proyecto son obligatorios', 'error'); return; }
    plist[idx].cliente   = cli;
    plist[idx].proyecto  = pro;
    plist[idx].tipo      = document.getElementById('eim-tipo').value;
    plist[idx].ubicacion = document.getElementById('eim-ubic').value.trim();
    plist[idx].assignedTo = document.getElementById('eim-asignado').value;
    plist[idx].usdArs     = parseFloat(document.getElementById('eim-tc').value) || cfg.usdArs || 1;
    plist[idx].margen     = parseFloat(document.getElementById('eim-mg').value) || cfg.margen || 10;
    plist[idx].metros    = parseFloat(document.getElementById('eim-metros').value) || 0;
    plist[idx].notas     = document.getElementById('eim-notas').value.trim();
    // Re-run totals in case TC or margen changed
    const tc     = plist[idx].usdArs || cfg.usdArs || 1;
    const isARS  = (plist[idx].moneda||'USD') === 'ARS';
    const mg100  = (plist[idx].margen || cfg.margen || 10) / 100;
    let baseTotal = 0;
    (plist[idx].modules || []).forEach(m => {
        if (m.mode === 'm2') { m.sub = (m.costUSD || 0) * (plist[idx].metros || 0); }
        else { m.sub = (m.items || []).reduce((s, it) => s + ((parseFloat(it.qty)||0) * ((parseFloat(it.priceMat??it.priceUSD??0)||0)+(parseFloat(it.priceMO)||0))), 0); }
        baseTotal += m.sub;
    });
    // totalUSD/ARS = precio al cliente (base + MG%)
    const baseUSD = isARS ? baseTotal / tc : baseTotal;
    const baseARS = isARS ? baseTotal       : baseTotal * tc;
    plist[idx].totalUSD = baseUSD * (1 + mg100);
    plist[idx].totalARS = baseARS * (1 + mg100);
    plist[idx].loUSD    = plist[idx].totalUSD * 0.9;   // -10% estimación preliminar
    plist[idx].hiUSD    = plist[idx].totalUSD * 1.1;   // +10% estimación preliminar
    logActivity(presupId, 'edit');
    saveDB();
    document.getElementById('eim-overlay').remove();
    toast('✅ Datos actualizados');
    refreshDetalle(presupId);
}

let ecmLogoTmp = null; // temporary logo state while modal is open

function handleEcmLogo(input, presupId) {
    const file = input.files[0];
    if (!file) return;
    if (file.size > 3 * 1024 * 1024) { toast('❌ Archivo muy grande (máx 3MB)', 'error'); return; }
    const reader = new FileReader();
    reader.onload = e => {
        const isImg = file.type.startsWith('image/');
        ecmLogoTmp = { name: file.name, dataUrl: e.target.result, isImg };
        const prev = document.getElementById('ecm-logo-preview');
        if (prev) {
            prev.innerHTML = isImg
                ? `<img src="${ecmLogoTmp.dataUrl}" style="max-height:60px;max-width:120px;border-radius:4px;object-fit:contain;border:1px solid #ddd">`
                : `<div style="font-size:12px;color:#555;background:#fff;border:1px solid #ddd;border-radius:4px;padding:6px 10px">📄 ${file.name}</div>`;
        }
    };
    reader.readAsDataURL(file);
}

    const c = modColor(modId);

    // Suppliers not yet assigned to this module
    const alreadyIds = (sesProvs[modId]||[]).map(p => p.supplierId);

    // Filter suppliers by specialty of this module
    const relevant = suppliers.filter(s => (s.specialty||[]).includes(modId) && !alreadyIds.includes(s.id));
    const others   = suppliers.filter(s => !(s.specialty||[]).includes(modId) && !alreadyIds.includes(s.id));

    let optHTML = '<option value="">— Elegir del directorio —</option>';
    if (relevant.length) {
        optHTML += `<optgroup label="Especialistas en ${modObj?.name||'este módulo'}">` +
            relevant.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('') + '</optgroup>';
    }
    if (others.length) {
        optHTML += `<optgroup label="Otros proveedores">` +
            others.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('') + '</optgroup>';
    }
    if (!relevant.length && !others.length) {
        optHTML = '<option value="">Sin proveedores en el directorio</option>';
    }

    modal.innerHTML =
        '<div style="padding:18px 22px 12px;border-bottom:1px solid #e8e8e8;display:flex;align-items:center;justify-content:space-between">' +
            `<span style="font-size:16px;font-weight:800">Agregar proveedor a <span style="background:${c.bg};color:${c.text};padding:2px 8px;border-radius:6px">${esc(modObj?.name||modId)}</span></span>` +

        '</div>' +
        '<div style="padding:20px 22px;display:flex;flex-direction:column;gap:12px">' +
            `<div><label class="flabel">Proveedor</label><select class="fselect" id="amp-sup">${optHTML}</select></div>` +
            '<div style="display:flex;gap:10px">' +
                '<div style="flex:1"><label class="flabel">Estado inicial</label><select class="fselect" id="amp-estado">' +
                    ESTADOS_PROV.map(e=>`<option value="${e.id}">${e.label}</option>`).join('') +
                '</select></div>' +
            '</div>' +
            '<div style="display:flex;gap:10px">' +
                '<div style="flex:0 0 80px"><label class="flabel">Moneda</label><select class="fselect" id="amp-moneda"><option value="ARS">ARS</option><option value="USD">USD</option></select></div>' +
                '<div style="flex:1"><label class="flabel">Monto cotizado</label><input class="finput" id="amp-monto" type="number" min="0" placeholder="0"></div>' +
                '<div style="flex:1"><label class="flabel">Plazo estimado</label><input class="finput" id="amp-plazo" type="date"></div>' +
            '</div>' +
            '<div><label class="flabel">Nota</label><input class="finput" id="amp-nota" placeholder="Observaciones…"></div>' +
        '</div>' +
        '<div style="padding:12px 22px;border-top:1px solid #e8e8e8;display:flex;gap:10px;justify-content:flex-end">' +
            '<button id="amp-cancel" class="btn btn-secondary">Cancelar</button>' +
            '<button id="amp-save" class="btn btn-success">Agregar al módulo</button>' +
        '</div>';

    overlay.appendChild(modal);
    document.body.appendChild(overlay);

    document.getElementById('amp-close').onclick  = () => overlay.remove();
    document.getElementById('amp-cancel').onclick = () => overlay.remove();
    document.getElementById('amp-save').onclick   = () => addModProvFromModal(modId);
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
}

function addModProvFromModal(modId) {
    const supId = document.getElementById('amp-sup').value;
    if (!supId) { toast('❌ Elegí un proveedor del directorio'); return; }
    const sup   = getSupplier(supId);
    if (!sup)   { toast('❌ Proveedor no encontrado'); return; }

    const entry = {
        id:           uid(),
        supplierId:   supId,
        supplierName: sup.name,
        estado:       document.getElementById('amp-estado').value || 'solicitado',
        moneda:       document.getElementById('amp-moneda').value || 'ARS',
        monto:        parseFloat(document.getElementById('amp-monto').value) || 0,
        plazo:        document.getElementById('amp-plazo').value || '',
        nota:         document.getElementById('amp-nota').value.trim(),
    };

    const presupId = window._ampPresupId;

    if (presupId) {
        // Llamado desde vDetalle — guardar directo en el presupuesto
        const p = plist.find(x => x.id === presupId);
        if (!p) { toast('❌ Presupuesto no encontrado'); return; }
        const mod = (p.modules || []).find(m => m.id === modId);
        if (!mod) { toast('❌ Módulo no encontrado'); return; }
        if (!mod.proveedores) mod.proveedores = [];
        mod.proveedores.push(entry);
        saveDB();

        // Re-render la tabla de proveedores en el detalle
        const el = document.getElementById('det-prov-' + modId);
        if (el) {
            const provs = mod.proveedores;
            el.innerHTML = provs.length > 0
                ? `<table style="width:100%;border-collapse:collapse;font-size:13px">
                    <thead><tr style="border-bottom:1px solid #eee">
                        <th style="text-align:left;padding:5px 8px;font-size:11px;color:#aaa;font-weight:600;text-transform:uppercase">Proveedor</th>
                        <th style="text-align:left;padding:5px 8px;font-size:11px;color:#aaa;font-weight:600;text-transform:uppercase">Estado</th>
                        <th style="text-align:left;padding:5px 8px;font-size:11px;color:#aaa;font-weight:600;text-transform:uppercase">Monto</th>
                        <th style="text-align:left;padding:5px 8px;font-size:11px;color:#aaa;font-weight:600;text-transform:uppercase">Plazo</th>
                        <th style="text-align:left;padding:5px 8px;font-size:11px;color:#aaa;font-weight:600;text-transform:uppercase">Nota</th>
                    </tr></thead>
                    <tbody>${provs.map(pv => `
                        <tr style="border-bottom:1px solid #f5f5f5">
                            <td style="padding:7px 8px;font-weight:500;font-size:14px">${esc(pv.supplierName||'—')}</td>
                            <td style="padding:7px 8px">${estadoPill(pv.estado)}</td>
                            <td style="padding:7px 8px;font-size:13px">${pv.monto ? (pv.moneda||'ARS') + ' ' + Math.round(pv.monto).toLocaleString('es-AR') : '—'}</td>
                            <td style="padding:7px 8px;font-size:13px;color:#777">${pv.plazo ? fDate(pv.plazo) : '—'}</td>
                            <td style="padding:7px 8px;font-size:13px;color:#777">${esc(pv.nota||'—')}</td>
                        </tr>`).join('')}
                    </tbody>
                  </table>`
                : `<div style="font-size:13px;color:#bbb;padding:4px 0">Sin proveedores asignados</div>`;
        }
    } else {
        // Llamado desde el estimador — sesión en memoria
        if (!sesProvs[modId]) sesProvs[modId] = [];
        sesProvs[modId].push(entry);
        const el = document.getElementById('mprov-' + modId);
        if (el) el.innerHTML = vModProvTable(modId);
    }

    document.getElementById('amp-overlay').remove();
    toast('✅ Proveedor agregado al módulo');
}

function supplierInitials(s) {
    return (s.name||'?').trim().split(' ').map(w=>w[0]).join('').slice(0,3).toUpperCase();
}

function supplierAvColor(s) {
    // Pick color from MOD_PALETTE based on first specialty or fallback
    const specIdx = s.specialty && s.specialty.length > 0
        ? cfg.modules.findIndex(m => m.id === s.specialty[0])
        : 0;
    const c = MOD_PALETTE[(specIdx >= 0 ? specIdx : 0) % MOD_PALETTE.length];
    return c;
}

function vProveedores() {
    const filter = (document._provFilter || '').toLowerCase();
    const modFilter = document._provModFilter || '';
    let list = suppliers.slice();
    if (filter)    list = list.filter(s => s.name.toLowerCase().includes(filter) || (s.specialty||[]).some(id => (cfg.modules.find(m=>m.id===id)?.name||'').toLowerCase().includes(filter)));
    if (modFilter) list = list.filter(s => (s.specialty||[]).includes(modFilter));

    const specOptions = cfg.modules.map(m => `<option value="${m.id}" ${modFilter===m.id?'selected':''}>${m.name}</option>`).join('');

    const rows = list.length === 0 ? `
        <div style="text-align:center;padding:60px 20px;color:#aaa">
            <div style="font-size:40px;margin-bottom:12px">◈</div>
            <div style="font-size:16px;font-weight:600;margin-bottom:6px">Sin proveedores cargados</div>
            <div style="font-size:14px">Agregá el primer proveedor con el botón de arriba.</div>
        </div>` : list.map(s => {
        const c = supplierAvColor(s);
        const initials = supplierInitials(s);
        const specs = (s.specialty||[]).map(id => {
            const mod = cfg.modules.find(m => m.id === id);
            const mc = modColor(id);
            return mod ? `<span style="display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;background:${mc.bg};color:${mc.text};margin-right:3px">${mod.name}</span>` : '';
        }).join('');
        const n = nivelObj(s.nivel || 'evaluacion');
        // Count obras
        const obras = plist.filter(p => (p.modules||[]).some(m => (m.proveedores||[]).some(pv => pv.supplierId === s.id)));
        const lastObra = obras.length > 0 ? obras[obras.length-1] : null;

        return `<div class="prov-list-row" onclick="showSupplierModal('${s.id}')">
            <div class="prov-av" style="background:${c.bg};color:${c.text}">${initials}</div>
            <div>
                <div style="font-size:15px;font-weight:600;margin-bottom:3px">${esc(s.name)}</div>
                <div>${specs || '<span style="font-size:12px;color:#ccc">Sin especialidad</span>'}</div>
            </div>
            <div class="prov-bars">
                ${nivelBadge(s.nivel||'evaluacion')}
                <div class="prov-bar-row" style="margin-top:5px"><span class="prov-bar-lbl">Plazos</span>${barSegs(s.plazos||0)}</div>
                <div class="prov-bar-row"><span class="prov-bar-lbl">Calidad</span>${barSegs(s.calidad||0)}</div>
            </div>
            <div style="text-align:right;min-width:90px" onclick="event.stopPropagation()">
                <div style="font-size:12px;color:#aaa">${obras.length} obra${obras.length!==1?'s':''}</div>
                ${lastObra ? `<div style="font-size:12px;color:#777;margin-top:2px">${esc(lastObra.proyecto||lastObra.cliente)}</div>` : ''}
                <div style="font-size:12px;color:#aaa;margin-top:3px">${vProveedorPriceBadge(s)}</div>
                <div style="display:flex;gap:6px;justify-content:flex-end;margin-top:6px">
                    <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();showUploadPriceListModal('${s.id}')" title="Listas de precios" style="padding:4px 8px;color:#7c3aed">📋</button>
                    <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();showSupplierModal('${s.id}')" title="Editar" style="padding:4px 8px">✏️</button>
                    <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();deleteSupplier('${s.id}')" title="Eliminar" style="padding:4px 8px;color:#dc2626">🗑</button>
                </div>
            </div>
        </div>`;
    }).join('');

    return `<div class="card">
        <div class="card-hd" style="gap:10px;flex-wrap:wrap">
            <span class="card-title">◈ Directorio de Proveedores</span>
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
                <input class="search" placeholder="Buscar…" value="${esc(document._provFilter||'')}"
                    oninput="document._provFilter=this.value;document.getElementById('app').innerHTML=vProveedores()" style="width:180px">
                <select class="fselect" style="font-size:13px;padding:6px 10px;width:auto"
                    onchange="document._provModFilter=this.value;document.getElementById('app').innerHTML=vProveedores()">
                    <option value="">Todos los módulos</option>
                    ${specOptions}
                </select>
            </div>
        </div>
        <div>${rows}</div>
    </div>`;
}
function vProveedorPriceBadge(s) {
    const lists = (s.priceLists||[]);
    if (!lists.length) return '';
    const last = [...lists].sort((a,b)=>b.period.localeCompare(a.period))[0];
    const ageMs = Date.now() - new Date(last.uploadedAt).getTime();
    const ageDays = Math.floor(ageMs/86400000);
    const [yr,mo] = last.period.split('-');
    const months = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    const periodStr = months[parseInt(mo)-1]+' '+yr;
    const isOld = ageDays > 45;
    return '<span style="font-size:11px;background:'+(isOld?'#fef2f2':'#f0fdf4')+';color:'+(isOld?'#dc2626':'#16a34a')+';border-radius:10px;padding:2px 8px;font-weight:600">'+(isOld?'⚠':'✅')+' lista '+periodStr+'</span>';
}

function showSupplierModal(supplierId) {
    const isEdit = !!supplierId;
    const s = isEdit ? suppliers.find(x => x.id === supplierId) : null;

    const existing = document.getElementById('sup-overlay');
    if (existing) existing.remove();

    const overlay = document.createElement('div');
    overlay.id = 'sup-overlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px';

    const modal = document.createElement('div');
    modal.style.cssText = 'background:#fff;border-radius:12px;box-shadow:0 16px 48px rgba(0,0,0,.22);width:100%;max-width:640px;max-height:90vh;overflow-y:auto;display:flex;flex-direction:column';

    // Build specialty checkboxes
    const specChecks = cfg.modules.map((m,i) => {
        const c = MOD_PALETTE[i % MOD_PALETTE.length];
        const checked = s && (s.specialty||[]).includes(m.id);
        return `<label style="display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;border:1.5px solid ${checked?c.border:'#e0e0e0'};background:${checked?c.bg:'#fff'};cursor:pointer;font-size:13px;font-weight:500;color:${checked?c.text:'#555'};transition:all .12s" id="spec-lbl-${m.id}">
            <input type="checkbox" id="spec-${m.id}" value="${m.id}" ${checked?'checked':''} style="display:none" onchange="toggleSpecLabel('${m.id}')">
            ${m.name}
        </label>`;
    }).join('');

    // Nivel selector
    const nivelOpts = NIVELES.map(n =>
        `<option value="${n.id}" ${(s?.nivel||'evaluacion')===n.id?'selected':''}>${n.label}</option>`
    ).join('');

    modal.innerHTML =
        '<div style="padding:20px 24px 14px;border-bottom:1px solid #e8e8e8;display:flex;align-items:center;justify-content:space-between">' +
            `<span style="font-size:17px;font-weight:800;color:#111">${isEdit?'Editar':'Nuevo'} proveedor</span>` +
            '<button id="sup-close" style="background:none;border:none;font-size:22px;color:#999;cursor:pointer">\xD7</button>' +
        '</div>' +
        '<div style="padding:22px 24px;display:flex;flex-direction:column;gap:16px">' +
            '<div class="g2" style="gap:14px">' +
                '<div class="fg" style="grid-column:1/-1"><label class="flabel">Nombre *</label><input class="finput" id="sup-name" placeholder="Nombre del proveedor o empresa"></div>' +
                '<div class="fg"><label class="flabel">Teléfono / WhatsApp</label><input class="finput" id="sup-tel" placeholder="+54 9 11 0000-0000"></div>' +
                '<div class="fg"><label class="flabel">Email</label><input class="finput" id="sup-email" type="email" placeholder="proveedor@mail.com"></div>' +
                '<div class="fg" style="grid-column:1/-1"><label class="flabel">Contacto (nombre de la persona)</label><input class="finput" id="sup-contacto" placeholder="Nombre de quien atiende"></div>' +
            '</div>' +
            '<div><label class="flabel" style="margin-bottom:8px">Módulos / especialidad</label>' +
                `<div style="display:flex;flex-wrap:wrap;gap:7px">${specChecks}</div>` +
            '</div>' +
            '<div class="g2" style="gap:14px">' +
                '<div class="fg"><label class="flabel">Nivel de servicio</label>' +
                    `<select class="fselect" id="sup-nivel">${nivelOpts}</select>` +
                '</div>' +
                '<div class="fg"></div>' +
                '<div class="fg"><label class="flabel">Plazos (1–5)</label><input class="finput" id="sup-plazos" type="number" min="0" max="5" placeholder="0"></div>' +
                '<div class="fg"><label class="flabel">Calidad (1–5)</label><input class="finput" id="sup-calidad" type="number" min="0" max="5" placeholder="0"></div>' +
            '</div>' +
            '<div><label class="flabel">Notas internas</label><textarea class="ftextarea" id="sup-notes" rows="2" placeholder="Observaciones, condiciones de pago, referencias…"></textarea></div>' +
            (isEdit ? '<div id="sup-price-lists-section">' + vPriceListSection(s) + '</div>' : '') +
        '</div>' +
        '<div style="padding:14px 24px;border-top:1px solid #e8e8e8;display:flex;gap:10px;justify-content:flex-end">' +
            '<button id="sup-cancel" class="btn btn-secondary">Cancelar</button>' +
            `<button id="sup-save" class="btn btn-success">💾 ${isEdit?'Guardar cambios':'Crear proveedor'}</button>` +
