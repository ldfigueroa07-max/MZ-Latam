    overlay.appendChild(modal);
    document.body.appendChild(overlay);

    // Set values via DOM
    document.getElementById('sup-name').value     = s?.name      || '';
    document.getElementById('sup-tel').value      = s?.tel       || '';
    document.getElementById('sup-email').value    = s?.email     || '';
    document.getElementById('sup-contacto').value = s?.contacto  || '';
    document.getElementById('sup-plazos').value   = s?.plazos    || '';
    document.getElementById('sup-calidad').value  = s?.calidad   || '';
    document.getElementById('sup-notes').value    = s?.notes     || '';

    document.getElementById('sup-close').onclick  = () => overlay.remove();
    document.getElementById('sup-cancel').onclick = () => overlay.remove();
    document.getElementById('sup-save').onclick   = () => saveSupplier(supplierId);
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });

}

function toggleSpecLabel(modId) {
    const cb  = document.getElementById('spec-' + modId);
    const lbl = document.getElementById('spec-lbl-' + modId);
    if (!cb || !lbl) return;
    const idx = cfg.modules.findIndex(m => m.id === modId);
    const c   = MOD_PALETTE[(idx>=0?idx:0) % MOD_PALETTE.length];
    if (cb.checked) {
        lbl.style.background  = c.bg;
        lbl.style.color       = c.text;
        lbl.style.borderColor = c.border;
    } else {
        lbl.style.background  = '#fff';
        lbl.style.color       = '#555';
        lbl.style.borderColor = '#e0e0e0';
    }
}

function saveSupplier(supplierId) {
    const name = document.getElementById('sup-name').value.trim();
    if (!name) { toast('❌ El nombre es obligatorio', 'error'); return; }

    const specialty = cfg.modules.map(m => m.id).filter(id => document.getElementById('spec-' + id)?.checked);

    const data = {
        name,
        tel:      document.getElementById('sup-tel').value.trim(),
        email:    document.getElementById('sup-email').value.trim(),
        contacto: document.getElementById('sup-contacto').value.trim(),
        specialty,
        nivel:    document.getElementById('sup-nivel').value,
        plazos:   parseInt(document.getElementById('sup-plazos').value) || 0,
        calidad:  parseInt(document.getElementById('sup-calidad').value) || 0,
        notes:    document.getElementById('sup-notes').value.trim(),
    };

    if (supplierId) {
        const idx = suppliers.findIndex(x => x.id === supplierId);
        if (idx !== -1) suppliers[idx] = { ...suppliers[idx], ...data };
    } else {
        suppliers.push({ id: uid(), createdAt: new Date().toISOString(), evaluations: [], ...data });
    }
    saveSuppliers();
    document.getElementById('sup-overlay').remove();
    toast(supplierId ? '✅ Proveedor actualizado' : '✅ Proveedor creado');
    document.getElementById('app').innerHTML = vProveedores();
}

function deleteSupplier(id) {
    const s = suppliers.find(x => x.id === id);
    if (!s) return;

    const existing = document.getElementById('del-sup-overlay');
    if (existing) existing.remove();

    const overlay = document.createElement('div');
    overlay.id = 'del-sup-overlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';

    const modal = document.createElement('div');
    modal.style.cssText = 'background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:100%;max-width:380px;padding:28px 28px 24px;text-align:center';

    const title = document.createElement('div');
    title.style.cssText = 'font-size:17px;font-weight:700;color:#111;margin-bottom:8px';
    title.textContent = 'Eliminar proveedor';

    const msg = document.createElement('div');
    msg.style.cssText = 'font-size:14px;color:#555;margin-bottom:24px;line-height:1.5';

    const nameSpan = document.createElement('strong');
    nameSpan.textContent = s.name;
    msg.appendChild(document.createTextNode('¿Confirmás que querés eliminar a '));
    msg.appendChild(nameSpan);
    msg.appendChild(document.createTextNode('? Esta acción no se puede deshacer.'));

    const btns = document.createElement('div');
    btns.style.cssText = 'display:flex;gap:10px;justify-content:center';

    const btnCancel = document.createElement('button');
    btnCancel.className = 'btn btn-primary';
    btnCancel.style.cssText = 'min-width:120px;font-size:14px';
    btnCancel.textContent = 'Cancelar';
    btnCancel.onclick = () => overlay.remove();

    const btnDel = document.createElement('button');
    btnDel.className = 'btn btn-danger';
    btnDel.style.cssText = 'min-width:120px;font-size:14px';
    btnDel.textContent = 'Sí, eliminar';
    btnDel.onclick = () => {
        suppliers = suppliers.filter(x => x.id !== id);
        saveSuppliers();
        overlay.remove();
        toast('Proveedor eliminado');
        document.getElementById('app').innerHTML = vProveedores();
    };

    btns.appendChild(btnCancel);
    btns.appendChild(btnDel);
    modal.appendChild(title);
    modal.appendChild(msg);
    modal.appendChild(btns);
    overlay.appendChild(modal);
    document.body.appendChild(overlay);

    // Foco en Cancelar por defecto (evita eliminación accidental)
    setTimeout(() => btnCancel.focus(), 50);

    // Cerrar con Escape
    overlay.addEventListener('keydown', e => { if (e.key === 'Escape') overlay.remove(); });
}

// ── XLSX lazy loader ──────────────────────────────
let _xlsxReady = false;
function loadXlsxLib(cb) {
    if (window.XLSX) { cb(); return; }
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => { _xlsxReady = true; cb(); };
    document.head.appendChild(s);
}

// ── Detectar columnas automáticamente ────────────
function detectColumns(rows) {
    if (!rows || rows.length < 2) return { descCol: 0, unitCol: -1, priceCol: 1 };
    const colCount = Math.max(...rows.map(r => r.length));
    const scores = { desc: [], unit: [], price: [] };

    for (let c = 0; c < colCount; c++) {
        const vals = rows.slice(1).map(r => r[c]).filter(v => v !== undefined && v !== null && v !== '');
        const numericRatio = vals.filter(v => !isNaN(parseFloat(String(v).replace(/[.,\s$]/g,'')))).length / (vals.length || 1);
        const avgLen = vals.reduce((s, v) => s + String(v).length, 0) / (vals.length || 1);
        const unitKeywords = /^(m2|m²|ml|u|un|gl|kg|tn|hr|jor|m3|lts?|pza?)$/i;
        const isUnitCol = vals.filter(v => unitKeywords.test(String(v).trim())).length / (vals.length || 1) > 0.3;
        scores.price.push(numericRatio > 0.7 ? numericRatio * 10 : 0);
        scores.unit.push(isUnitCol ? 10 : 0);
        scores.desc.push(numericRatio < 0.3 && avgLen > 5 && !isUnitCol ? avgLen * 0.5 : 0);
    }

    const bestPrice = scores.price.indexOf(Math.max(...scores.price));
    const bestUnit  = scores.unit.indexOf(Math.max(...scores.unit));
    const bestDesc  = scores.desc.indexOf(Math.max(...scores.desc));

    return {
        descCol:  bestDesc,
        unitCol:  scores.unit[bestUnit] > 0 ? bestUnit : -1,
        priceCol: bestPrice
    };
}

// ── Parser numérico formato ARS (3.561,86 → 3561.86) ─
function parseArPrice(val) {
    if (typeof val === 'number') return val;
    const s = String(val).replace(/[$\s]/g, '').trim();
    if (!s) return 0;
    // Formato AR: punto=miles, coma=decimal → "3.561,86"
    if (s.includes(',')) return parseFloat(s.replace(/\./g,'').replace(',','.')) || 0;
    // Formato numérico estándar
    return parseFloat(s.replace(/,/g,'')) || 0;
}

// ── Leer y detectar columnas ──────────────────────
function plReadFile(supplierId) {
    const fileEl = document.getElementById('pl-file');
    if (!fileEl || !fileEl.files[0]) { toast('❌ Seleccioná un archivo', 'error'); return; }
    const file = fileEl.files[0];

    loadXlsxLib(() => {
        const reader = new FileReader();
        reader.onload = e => {
            try {
                const wb   = XLSX.read(e.target.result, { type: 'array' });
                const ws   = wb.Sheets[wb.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
                const filteredRows = rows.filter(r => r.some(c => c !== ''));
                if (filteredRows.length < 2) { toast('❌ El archivo parece estar vacío', 'error'); return; }

                const s         = suppliers.find(x => x.id === supplierId);
                const savedMap  = s?.priceListColumnMap || null;
                const detected  = savedMap || detectColumns(filteredRows);

                window._plRows = filteredRows;
                window._plDetected = detected;

                renderPlPreview(filteredRows, detected, filteredRows[0]);
            } catch(err) {
                toast('❌ Error leyendo el archivo: ' + err.message, 'error');
            }
        };
        reader.readAsArrayBuffer(file);
    });
}

    if (!area) return;
    const colCount = Math.max(...rows.map(r => r.length));
    const colOptions = (sel) => Array.from({length: colCount}, (_,i) =>
        `<option value="${i}" ${sel===i?'selected':''}>${headers[i] || 'Col '+(i+1)}</option>`
    ).join('');
    const noneOpt = (sel) => `<option value="-1" ${sel===-1?'selected':''}>— Ninguna —</option>`;

    const preview = rows.slice(1, 8).map((r,ri) => {
        const desc  = map.descCol  >= 0 ? r[map.descCol]  : '';
        const unit  = map.unitCol  >= 0 ? r[map.unitCol]  : '';

    }).join('');

    area.innerHTML = `
        <div style="background:#f8f9ff;border:1px solid #e0e4ff;border-radius:8px;padding:14px">
            <div style="font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#4f46e5;margin-bottom:12px">🔍 Mapeo de columnas detectado</div>

                </div>

                    <label style="font-size:11px;font-weight:600;color:#555;display:block;margin-bottom:4px">Precio</label>
                    <select class="fselect" id="pl-col-price" style="font-size:13px" onchange="plUpdatePreview()">

                    <th style="text-align:left;padding:6px 10px;font-size:11px;color:#aaa;font-weight:600;text-transform:uppercase">Descripción</th>

    const descCol  = parseInt(document.getElementById('pl-col-desc')?.value ?? '-1');
    const unitCol  = parseInt(document.getElementById('pl-col-unit')?.value ?? '-1');
    const priceCol = parseInt(document.getElementById('pl-col-price')?.value ?? '-1');
    const rows     = window._plRows || [];
    const map      = { descCol, unitCol, priceCol };
    window._plDetected = map;
    const headers  = rows[0] || [];

    const preview = rows.slice(1, 8).map((r,ri) => {
        const desc  = descCol  >= 0 ? r[descCol]  : '';
        const unit  = unitCol  >= 0 ? r[unitCol]  : '';
        const price = priceCol >= 0 ? r[priceCol] : '';
        const priceNum = parseArPrice(price);
        return `<tr style="border-bottom:1px solid #f0f0f0;${ri%2===0?'background:#fafafa':''}">
            <td style="padding:7px 10px;font-size:13px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(String(desc))}</td>
            <td style="padding:7px 10px;font-size:13px;text-align:center;color:#666">${esc(String(unit))}</td>

}

// ── Guardar lista en proveedor ────────────────────
function plSaveList(supplierId) {
    const period   = document.getElementById('pl-period')?.value;
    if (!period) { toast('❌ Indicá el mes de vigencia', 'error'); return; }
    const rows     = window._plRows || [];
    const map      = window._plDetected || {};
    const { descCol, unitCol, priceCol } = map;

    const items = rows.slice(1).reduce((acc, r) => {
        const desc  = descCol  >= 0 ? String(r[descCol] || '').trim() : '';
        const unit  = unitCol  >= 0 ? String(r[unitCol] || '').trim() : 'gl';
        const rawP  = priceCol >= 0 ? r[priceCol] : '';
        const price = parseArPrice(rawP);
        if (desc && price > 0) acc.push({ desc, unit: unit||'gl', price });
        return acc;
    }, []);

    if (items.length === 0) { toast('❌ No se encontraron ítems con precio válido', 'error'); return; }

    const si = suppliers.findIndex(x => x.id === supplierId);
    if (si < 0) return;

    if (!suppliers[si].priceLists) suppliers[si].priceLists = [];
    // Reemplazar si ya existe ese período, sino agregar
    const existIdx = suppliers[si].priceLists.findIndex(pl => pl.period === period);
    const plEntry = {
        id:          uid(),
        period,
        uploadedAt:  new Date().toISOString(),
        fileName:    document.getElementById('pl-file')?.files[0]?.name || 'lista.xlsx',
        columnMap:   { descCol, unitCol, priceCol },
        items
    };
    if (existIdx >= 0) suppliers[si].priceLists[existIdx] = plEntry;
    else suppliers[si].priceLists.unshift(plEntry);
    // Guardar mapeo para próxima vez
    suppliers[si].priceListColumnMap = { descCol, unitCol, priceCol };
    saveSuppliers();

    document.getElementById('pl-upload-overlay').remove();
    toast('✅ Lista de ' + period + ' guardada — ' + items.length + ' ítems');
    document.getElementById('app').innerHTML = vProveedores();
}

// ── Sección "Listas de precios" en card proveedor ──
function vPriceListSection(s) {
    const lists  = (s.priceLists || []).slice().sort((a,b) => b.period.localeCompare(a.period));
    const last2  = lists.slice(0, 2);

    let changeBadge = '';
    if (last2.length === 2) {
        const avgNew = last2[0].items.reduce((s,i) => s+i.price, 0) / (last2[0].items.length||1);
        const avgOld = last2[1].items.reduce((s,i) => s+i.price, 0) / (last2[1].items.length||1);
        const pct    = avgOld > 0 ? ((avgNew - avgOld) / avgOld * 100).toFixed(1) : 0;
        const color  = pct > 0 ? '#dc2626' : pct < 0 ? '#16a34a' : '#999';
        const arrow  = pct > 0 ? '↑' : pct < 0 ? '↓' : '=';
        changeBadge  = `<span style="font-size:12px;font-weight:700;color:${color};background:${pct>0?'#fef2f2':pct<0?'#f0fdf4':'#f5f5f5'};border-radius:20px;padding:2px 10px">${arrow} ${Math.abs(pct)}% vs mes anterior</span>`;
    }

    const rows = lists.slice(0, 5).map(pl => {
        const date   = new Date(pl.uploadedAt);
        const dateStr= date.toLocaleDateString('es-AR', {day:'2-digit',month:'2-digit',year:'2-digit'});
        const ageMs  = Date.now() - date.getTime();
        const ageDays= Math.floor(ageMs / 86400000);
        const isOld  = ageDays > 45;
        const [yr, mo] = pl.period.split('-');
        const months = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
        const periodStr = months[parseInt(mo)-1] + ' ' + yr;
        return `<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f5f5f5">
            <div style="display:flex;align-items:center;gap:8px">
                <span style="font-size:13px;font-weight:600;color:#111">${periodStr}</span>
                <span style="font-size:11px;color:#aaa">· ${pl.items.length} ítems · subida ${dateStr}</span>
                ${isOld ? '<span style="font-size:11px;color:#dc2626;font-weight:600">⚠ +45 días</span>' : ''}
            </div>
        </div>`;
    }).join('');

    return `<div style="border-top:1px solid #ebebeb;margin-top:14px;padding-top:14px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
            <div style="display:flex;align-items:center;gap:10px">
                <span style="font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#999">📋 Listas de precios</span>
                ${changeBadge}
            </div>
            <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();showUploadPriceListModal('${s.id}')" style="font-size:12px;color:#7c3aed;padding:3px 10px">＋ Subir lista</button>
        </div>
        ${lists.length === 0
            ? `<div style="font-size:13px;color:#bbb;padding:4px 0">Sin listas cargadas aún</div>`
            : rows}
    </div>`;
}

function impConfirmItems(presupId, modId) {
    const s      = suppliers.find(x => x.id === window._impSupplierId);
    const lists  = (s?.priceLists||[]).slice().sort((a,b) => b.period.localeCompare(a.period));
    const last   = lists[0];
    if (!last) return;

    const p    = plist.find(x => x.id === presupId);
    const tc   = p?.usdArs || cfg.usdArs || 1;
    const isARS= (p?.moneda||'USD') === 'ARS';

    const checked = Array.from(document.querySelectorAll('#imp-items-tbody input[type="checkbox"]'))
        .filter(cb => cb.checked)
        .map(cb => parseInt(cb.dataset.idx));

    if (checked.length === 0) { toast('❌ Seleccioná al menos un ítem', 'error'); return; }

    const pi  = plist.findIndex(x => x.id === presupId);
    const mod = plist[pi]?.modules?.find(m => m.id === modId);
    if (!mod) return;
    if (!mod.items) mod.items = [];

    const [yr, mo] = (window._impPeriod||'').split('-');
    const months = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    const periodStr = months[parseInt(mo)-1] + ' ' + yr;

    checked.forEach(idx => {
        const item = last.items[idx];
        if (!item) return;
        const priceVal = isARS ? item.price / tc : item.price;
        mod.items.push({
            id:           uid(),
            desc:         item.desc,
            qty:          1,
            unit:         item.unit || 'gl',
            priceMat:     parseFloat(priceVal.toFixed(2)),
            priceMO:      0,
            supplierId:   s.id,
            sourcePeriod: last.period
        });
    });

    // Recalcular subtotal del módulo
    mod.sub = mod.items.reduce((s,it) => s + (parseFloat(it.qty)||0)*((parseFloat(it.priceMat??it.priceUSD??0)||0)+(parseFloat(it.priceMO)||0)), 0);
    _recalcPresupTotals(pi);
    saveDB();

    document.getElementById('imp-sup-overlay').remove();
    toast('✅ ' + checked.length + ' ítems importados desde ' + esc(s.name) + ' · lista ' + periodStr);

    // Refresh desglose
    const detEl = document.getElementById('dm-' + modId);
    if (detEl) {
        const tbody = document.getElementById('dmi-tbody-' + modId);
        if (tbody) {
            tbody.innerHTML = mod.items.map((it,ri) => vDetItemRow(it, ri, modId, p)).join('');
        }
        const totEl = document.getElementById('dm-tot-' + modId);
        if (totEl) totEl.innerHTML = `<div class="det-mod-usd">${fPriP(mod.sub,p)}</div><div class="det-mod-ars">${fSecP(mod.sub,p)}</div>`;
    }
    updateResultPanel(presupId);
}

function showSyncPricesModal(presupId, modId) {
    const p   = plist.find(x => x.id === presupId);
    const mod = p?.modules?.find(m => m.id === modId);
    if (!p || !mod) return;
    const tc    = p.usdArs || cfg.usdArs || 1;
    const isARS = (p.moneda||'USD') === 'ARS';
    const months = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    const fPer   = per => { const [yr,mo] = (per||'').split('-'); return (months[parseInt(mo)-1]||'?')+' '+yr; };

    // Agrupar ítems por supplierId
    const suppMap = {};
    (mod.items||[]).forEach(it => {
        if (!it.supplierId) return;
        if (!suppMap[it.supplierId]) suppMap[it.supplierId] = [];
        suppMap[it.supplierId].push(it);
    });
    if (Object.keys(suppMap).length === 0) {
        toast('ℹ️ No hay ítems vinculados a proveedores en este módulo'); return;
    }

    // Construir diff por proveedor
    let hasChanges = false;
    const diff = [];
    Object.entries(suppMap).forEach(([sid, items]) => {
        const s = suppliers.find(x => x.id === sid);
        if (!s) return;
        const lists   = (s.priceLists||[]).slice().sort((a,b) => b.period.localeCompare(a.period));
        const latest  = lists[0];
        const curPer  = items[0].sourcePeriod || null;
        const hasNew  = latest && (!curPer || latest.period > curPer);
        const norm    = d => (d||'').toLowerCase().trim().replace(/\s+/g,' ');
        const diffItems = items.map(it => {
            const curPrice = parseFloat(it.priceMat ?? it.priceUSD ?? 0) || 0;
            if (!latest) return { item: it, currentUSD: curPrice, newUSD: null, pct: null, found: false };
            const match = latest.items.find(li => norm(li.desc) === norm(it.desc));
            if (!match) return { item: it, currentUSD: curPrice, newUSD: null, pct: null, found: false };
            const newUSD = isARS ? match.price / tc : match.price;
            const pct    = curPrice > 0 ? ((newUSD - curPrice) / curPrice * 100) : 0;
            return { item: it, currentUSD: curPrice, newUSD: parseFloat(newUSD.toFixed(2)), pct: parseFloat(pct.toFixed(1)), found: true };
        });
        diff.push({ supplierId: sid, supplierName: s.name, currentPeriod: curPer, newPeriod: latest?.period||null, hasNew, items: diffItems });
    });

    window._syncDiff = { presupId, modId, diff };

    const fAmt = v => {
        if (v == null) return '—';
        return isARS ? '$ ' + Math.round(v).toLocaleString('es-AR') : 'USD ' + Math.round(v).toLocaleString('es-AR');
    };

    const suppHTML = diff.map(sd => {
        const per    = sd.newPeriod ? fPer(sd.newPeriod) : '—';
        const curPer = sd.currentPeriod ? fPer(sd.currentPeriod) : 'desconocido';
        const periodBadge = sd.hasNew
            ? `<span style="font-size:11px;background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:10px;font-weight:600">${curPer} → ${per}</span>`
            : `<span style="font-size:11px;background:#f0fdf4;color:#166534;padding:2px 8px;border-radius:10px">Ya actualizado · ${per}</span>`;

        const rowsHTML = sd.items.map(di => {
            if (!di.found) {
                return `<tr style="opacity:.45">
                    <td style="padding:8px 12px;font-size:13px">${esc(di.item.desc)}</td>
                    <td style="padding:8px 12px;font-size:13px;text-align:right">${fAmt(di.currentUSD)}</td>
                    <td style="padding:8px 12px;font-size:13px;text-align:right;color:#aaa">—</td>
                    <td style="padding:8px 12px;font-size:12px;text-align:center;color:#aaa;font-style:italic">No encontrado</td>
                </tr>`;
            }
            const changed = Math.abs(di.pct) >= 0.1;
            if (changed) hasChanges = true;
            const pctColor = di.pct > 0 ? '#dc2626' : di.pct < 0 ? '#059669' : '#888';
            const pctStr   = di.pct > 0 ? '+'+di.pct+'%' : di.pct+'%';
            return `<tr style="${changed ? 'background:#fffbeb' : ''}">
                <td style="padding:8px 12px;font-size:13px">${esc(di.item.desc)}</td>
                <td style="padding:8px 12px;font-size:13px;text-align:right;color:#888;text-decoration:${changed?'line-through':''}">${fAmt(di.currentUSD)}</td>
                <td style="padding:8px 12px;font-size:13px;text-align:right;font-weight:${changed?'700':'400'}">${fAmt(di.newUSD)}</td>
                <td style="padding:8px 12px;font-size:13px;text-align:center;font-weight:600;color:${pctColor}">${changed ? pctStr : '—'}</td>
            </tr>`;
        }).join('');

        return `<div style="margin-bottom:20px">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
                <span style="font-weight:700;font-size:14px">${esc(sd.supplierName)}</span>
                ${periodBadge}
            </div>
            <table style="width:100%;border-collapse:collapse;font-size:13px;border:1px solid #e8e8e8;border-radius:8px;overflow:hidden">
                <thead>
                    <tr style="background:#f5f5f5">
                        <th style="text-align:left;padding:7px 12px;font-size:11px;color:#888;font-weight:600;text-transform:uppercase">Descripción</th>
                        <th style="text-align:right;padding:7px 12px;font-size:11px;color:#888;font-weight:600;text-transform:uppercase;white-space:nowrap">Precio actual</th>
                        <th style="text-align:right;padding:7px 12px;font-size:11px;color:#888;font-weight:600;text-transform:uppercase;white-space:nowrap">Precio nuevo</th>
                        <th style="text-align:center;padding:7px 12px;font-size:11px;color:#888;font-weight:600;text-transform:uppercase;width:70px">Var.</th>
                    </tr>
                </thead>
                <tbody>${rowsHTML}</tbody>
            </table>
        </div>`;
    }).join('');

    const overlay = document.createElement('div');
    overlay.id = 'sync-prices-overlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
    overlay.innerHTML = `
    <div style="background:#fff;border-radius:14px;width:100%;max-width:640px;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)">
        <div style="padding:20px 24px 14px;border-bottom:1px solid #ebebeb;display:flex;align-items:center;justify-content:space-between">
            <div>
                <div style="font-size:17px;font-weight:700;color:#111">🔄 Actualizar precios</div>
                <div style="font-size:13px;color:#888;margin-top:2px">${esc(mod.name)} · precios desde lista de proveedor</div>
            </div>
            <button onclick="document.getElementById('sync-prices-overlay').remove()" style="background:none;border:none;cursor:pointer;font-size:22px;color:#888;line-height:1">✕</button>
        </div>
        <div style="overflow-y:auto;flex:1;padding:20px 24px">${suppHTML}</div>
        <div style="padding:14px 24px;border-top:1px solid #ebebeb;display:flex;gap:10px;align-items:center;justify-content:space-between">
            <span style="font-size:12px;color:#aaa">Los ítems "No encontrado" se conservan sin cambios</span>
            <div style="display:flex;gap:10px">
                <button class="btn btn-secondary" onclick="document.getElementById('sync-prices-overlay').remove()">Cancelar</button>
                <button class="btn btn-primary" id="sync-apply-btn" ${!hasChanges ? 'disabled' : ''} onclick="applySyncPrices()"
                    style="${!hasChanges ? 'opacity:.45;cursor:not-allowed' : ''}">
                    ✅ Aplicar cambios
                </button>
            </div>
        </div>
    </div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
}

function applySyncPrices() {
    const { presupId, modId, diff } = window._syncDiff || {};
    if (!presupId || !modId) return;
    const pi  = plist.findIndex(x => x.id === presupId);
    const p   = plist[pi];
    const mod = p?.modules?.find(m => m.id === modId);
    if (!mod) return;

    let updated = 0;
    diff.forEach(sd => {
        sd.items.forEach(di => {
            if (!di.found || Math.abs(di.pct||0) < 0.1) return;
            const it = mod.items.find(x => x.id === di.item.id);
            if (!it) return;
            it.priceMat     = di.newUSD;
            it.sourcePeriod = sd.newPeriod;
            updated++;
        });
    });

    if (updated === 0) { toast('ℹ️ Sin cambios para aplicar'); return; }

    mod.sub = mod.items.reduce((s,it) => s + (parseFloat(it.qty)||0)*((parseFloat(it.priceMat??it.priceUSD??0)||0)+(parseFloat(it.priceMO)||0)), 0);
    _recalcPresupTotals(pi);
    saveDB();

    document.getElementById('sync-prices-overlay')?.remove();
    toast('✅ ' + updated + ' precio'+(updated!==1?'s':'')+' actualizados');

    const tbody = document.getElementById('dmi-tbody-' + modId);
    if (tbody) tbody.innerHTML = mod.items.map((it,ri) => vDetItemRow(it, ri, modId, p)).join('');
    const totEl = document.getElementById('dm-tot-' + modId);
    if (totEl) totEl.innerHTML = `<div class="det-mod-usd">${fPriP(mod.sub,p)}</div><div class="det-mod-ars">${fSecP(mod.sub,p)}</div>`;
    updateResultPanel(presupId);
}

async function handleLicitacionFile(file) {
    if (!file) return;
    if (!file.name.toLowerCase().endsWith('.xlsx')) {
        toast('❌ Solo se aceptan archivos .xlsx');
        return;
    }
    const zone = document.getElementById('lic-drop-zone');
    if (zone) zone.innerHTML = '<div style="font-size:14px;color:#888;padding:10px 0">⏳ Leyendo archivo…</div>';
    try {
        // Lazy-load ExcelJS (misma lógica que exportExcel)
        if (!window.ExcelJS) {
            await new Promise((res, rej) => {
                const sc = document.createElement('script');
                sc.src = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
                sc.onload = res; sc.onerror = rej;
                document.head.appendChild(sc);
            });
        }
        const buffer = await file.arrayBuffer();
        const parsed = await parseLicitacionXlsx(buffer);
        // Convert buffer → base64
        const bytes = new Uint8Array(buffer);
        let bin = '';
        const chunk = 8192;
        for (let i = 0; i < bytes.length; i += chunk) {
            bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
        }
        const b64 = btoa(bin);
        showLicitacionPreview(parsed, file.name, b64);
        if (zone) zone.innerHTML = `
            <div style="font-size:22px;margin-bottom:6px">✅</div>
            <div style="font-weight:600;color:#059669;font-size:14px">${esc(file.name)}</div>
            <div style="font-size:13px;color:#888;margin-top:3px">${parsed.modules.length} módulo${parsed.modules.length!==1?'s':''} · ${parsed.totalItems} ítem${parsed.totalItems!==1?'s':''} detectados</div>`;
    } catch(err) {
        if (zone) zone.innerHTML = `
            <div style="font-size:22px;margin-bottom:6px">❌</div>
            <div style="font-size:13px;color:#dc2626">${esc(err.message)}</div>
            <div style="font-size:12px;color:#888;margin-top:6px;cursor:pointer;text-decoration:underline"
                 onclick="document.getElementById('lic-file-input').click()">Intentar con otro archivo</div>`;
        toast('❌ ' + err.message, 'error');
    }
}

async function parseLicitacionXlsx(buffer) {
    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(buffer);
    const ws = wb.worksheets[0];
    if (!ws) throw new Error('El archivo no tiene hojas de cálculo.');

    const norm = v => String(v == null ? '' : v).toLowerCase().trim()
        .normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ');

    // ── Detect header row ────────────────────────────────────
    let headerRow = -1;
    const cols = {};

    for (let r = 1; r <= 30 && headerRow < 0; r++) {
        const row = ws.getRow(r);
        const cells = {};
        row.eachCell({ includeEmpty: false }, (cell, col) => {
            // Only use plain string cell values for header detection (not formula objects)
            const v = cell.value;
            if (typeof v === 'string') cells[col] = norm(v);
        });

        // Try to assign columns from this row
        const candidate = {};
        Object.entries(cells).forEach(([col, v]) => {
            const c = parseInt(col);
            if (!candidate.code    && (v === 'item' || v === 'codigo' || v === 'cap.' || v === 'capitulo' || v.match(/^n[°o.]/))) candidate.code    = c;
            if (!candidate.desc    && (v.includes('descripci') || v === 'rubro/tarea' || v === 'rubro' || v === 'tarea' || v.includes('designacion'))) candidate.desc    = c;
            if (!candidate.unit    && (v === 'u' || v === 'ud' || v === 'udad' || v.includes('unidad')))                           candidate.unit    = c;
            if (!candidate.qty     && (v === 'cant' || v.includes('cantidad')))                                                     candidate.qty     = c;
            if (!candidate.priceMO && (v.includes('p.mo') || v.includes('p. mo') || v.includes('mano de obra') || v.includes('m.o') || v.includes('precio mo') || v.includes('p.unit.mo'))) candidate.priceMO = c;
            if (!candidate.price   && (v.includes('p.unit') || v.includes('unitario') || v.includes('precio mat') || v.includes('precio unit') || v.includes('costo unit') || v.includes('p. unit'))) candidate.price   = c;
        });

        // Valid header: must have desc AND qty in DIFFERENT columns
        if (!candidate.desc || !candidate.qty || candidate.desc === candidate.qty) continue;

        headerRow = r;
        Object.assign(cols, candidate);
    }

    if (headerRow < 0) throw new Error('No se encontró la fila de encabezados. Verificá que el Excel tenga columnas de Descripción y Cantidad.');
    if (!cols.desc)    throw new Error('No se pudo identificar la columna de descripción.');
    // Fallbacks for optional cols
    if (!cols.code)  cols.code  = Math.max(1, cols.desc - 1);
    if (!cols.unit)  cols.unit  = cols.qty  !== cols.desc + 1 ? cols.desc + 1 : cols.desc + 2;
    if (!cols.price) cols.price = cols.desc + 3;

    // ── Parse rows ────────────────────────────────────────────
    // Handle plain strings AND Excel formula objects {formula, result}
    const getCellText = cell => {
        const v = cell.value;
        if (v == null) return '';
        if (typeof v === 'string') return v;
        if (typeof v === 'number') return String(v);
        if (typeof v === 'object') {
            // Formula cell: {formula: "...", result: ...}
            const r = v.result;
            if (r == null || r instanceof Date) return ''; // depth-1 sections or unresolved
            if (typeof r === 'string') return r;
            if (typeof r === 'number') return String(r);
        }
        return '';
    };

    const codeDepth = v => {
        const s = String(v == null ? '' : v).trim();
        if (!s || !/^\d/.test(s)) return 0;
        return s.split('.').length;
    };

    const modules = [];
    let currentMod = null;

    for (let r = headerRow + 1; r <= ws.rowCount; r++) {
        const row  = ws.getRow(r);
        const code = getCellText(row.getCell(cols.code)).trim();
        const desc = getCellText(row.getCell(cols.desc)).trim();

        if (!code || !/^\d/.test(code)) continue;
        const depth = codeDepth(code);
        if (depth < 2) continue;

        if (depth === 2) {
            if (desc) {
                currentMod = { code, name: desc, items: [] };
                modules.push(currentMod);
            }
            continue;
        }

        if (!currentMod || !desc) continue;

        const unitV     = getCellText(row.getCell(cols.unit)).trim() || 'gl';
        const qtyNum    = parseFloat(getCellText(row.getCell(cols.qty)).replace(',', '.'))         || 1;
        const priceNum  = parseFloat(getCellText(row.getCell(cols.price)).replace(',', '.'))       || 0;
        const priceMONum= cols.priceMO ? (parseFloat(getCellText(row.getCell(cols.priceMO)).replace(',', '.')) || 0) : 0;

        currentMod.items.push({ desc, unit: unitV, qty: qtyNum, price: priceNum, priceMO: priceMONum, row: r });
    }

    const validMods = modules.filter(m => m.items.length > 0);
    if (validMods.length === 0) throw new Error('No se encontraron módulos con ítems. Verificá que el Excel tenga secciones numeradas (ej: 1.1, 1.2…)');

    return {
        modules:    validMods,
        cols,
        headerRow,
        sheetName:  ws.name,
        totalItems: validMods.reduce((s, m) => s + m.items.length, 0)
    };
}

        <div style="padding:13px 24px 8px;background:#f0fdf4;border-bottom:1px solid #d1fae5">
            <div style="font-size:13px;color:#065f46;font-weight:600">
                ${parsed.modules.length} módulo${parsed.modules.length!==1?'s':''} ·
                ${parsed.totalItems} ítem${parsed.totalItems!==1?'s':''} ·
                Los precios quedan en $0 para completar con proveedores
            </div>
        </div>
        <div style="overflow-y:auto;flex:1;padding:12px 24px">${modRows}</div>
        <div style="padding:14px 24px;border-top:1px solid #ebebeb;display:flex;gap:10px;justify-content:flex-end">
            <button class="btn btn-secondary" onclick="document.getElementById('lic-preview-overlay').remove()">Cancelar</button>
            <button class="btn btn-primary"   onclick="confirmLicitacionImport()">✅ Crear licitación</button>
        </div>
    </div>`;
    document.body.appendChild(ol);
    ol.addEventListener('click', e => { if (e.target === ol) ol.remove(); });
}

function confirmLicitacionImport() {
    const parsed  = window._licParsed;
    const licFile = window._licFile;
    if (!parsed || !licFile) return;
    document.getElementById('lic-preview-overlay')?.remove();

    const tc  = cfg.usdArs || 1450;
    const mg  = cfg.margen  || 15;

    const modules = parsed.modules.map(m => {
        const items = m.items.map(it => ({
            id:       uid(),
            desc:     it.desc,
            qty:      it.qty,
            unit:     it.unit,
            priceMat: parseFloat(((it.price  || 0) / tc).toFixed(2)),
            priceMO:  parseFloat(((it.priceMO|| 0) / tc).toFixed(2)),
            licitRow: it.row
        }));
        const sub = items.reduce((s, it) => s + it.qty * (it.priceMat + it.priceMO), 0);
        return {
            id:         uid(),
            name:       m.name,
            emoji:      '📦',
            costUSD:    0,
            on:         true,
            mode:       'items',
            items,
            files:      [],
            notes:      '',
            proveedores:[],
            sub
        };
    });

    const baseTotal = modules.reduce((s, m) => s + m.sub, 0);
    const totalUSD  = baseTotal * (1 + mg / 100);

    const cleanName = licFile.name
        .replace(/\.xlsx$/i, '')
        .replace(/_/g, ' ')
        .replace(/MZ\s*LATAM/i, '')
        .trim();

    const np = {
        id:          Date.now().toString(),
        num:         nextN(),
        cliente:     '',
        proyecto:    cleanName,
        tipo:        'local',
        ubicacion:   '',
        notas:       '',
        metros:      0,
        moneda:      'ARS',
        usdArs:      tc,
        margen:      mg,
        modules,
        totalUSD,
        totalARS:    totalUSD * tc,
        loUSD:       totalUSD * 0.9,
        hiUSD:       totalUSD * 1.1,
        status:      'abierto',
        fecha:       new Date().toISOString(),
        updatedAt:   new Date().toISOString(),
        createdAt:   new Date().toISOString(),
        attachments: [],
        activity:    [],
        contacts:    { comercial:{nom:'',email:'',tel:''}, administracion:{nom:'',email:'',tel:''}, legales:{nom:'',email:'',tel:''} },
        assignedTo:  currentUser ? currentUser.id : '',
        licitacion: {
            fileName:  licFile.name,
            fileData:  licFile.data,
            cols:      parsed.cols,
            headerRow: parsed.headerRow,
            sheetName: parsed.sheetName
        }
    };

    plist.push(np);
    saveDB();
    window._licParsed = null;
    window._licFile   = null;
    toast('✅ Licitación importada — ' + np.modules.length + ' módulos, ' + parsed.totalItems + ' ítems');
    nav('detalle', np.id);
}

// ── Bloque 4: Match con proveedores ──────────────────────────────

function matchLicitacionWithSuppliers(presupId) {
    const p = plist.find(x => x.id === presupId);
    if (!p) return;

    // Gather all supplier items (latest price list per supplier)
    const allSupItems = [];
    suppliers.forEach(s => {
        const lists = (s.priceLists||[]).slice().sort((a,b) => b.period.localeCompare(a.period));
        const latest = lists[0];
        if (!latest) return;
        (latest.items||[]).forEach(li => {
            allSupItems.push({ supplierId: s.id, supplierName: s.name, period: latest.period, item: li });
        });
    });

    if (allSupItems.length === 0) {
        toast('ℹ️ No hay proveedores con listas de precios cargadas');
        return;
    }

    const tc   = p.usdArs || cfg.usdArs || 1450;
    const isARS = (p.moneda || 'USD') === 'ARS';
    const norm  = v => (v||'').toLowerCase().trim()
        .normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g,' ');

    const matches = [];
    let skipped = 0;

    (p.modules||[]).forEach(m => {
        (m.items||[]).forEach(it => {
            const normDesc = norm(it.desc);
            // Try exact match first, then partial
            let found = allSupItems.find(si => norm(si.item.desc) === normDesc);
            if (!found) {
                found = allSupItems.find(si => norm(si.item.desc).includes(normDesc) && normDesc.length > 5);
            }
            if (!found) { skipped++; return; }
            const priceUSD = isARS ? found.item.price / tc : found.item.price;
            matches.push({
                modId:        m.id,
                modName:      m.name,
                itemId:       it.id,
                itemDesc:     it.desc,
                itemQty:      it.qty,
                itemUnit:     it.unit,
                currentUSD:   parseFloat(it.priceMat??it.priceUSD??0) || 0,
                supplierId:   found.supplierId,
                supplierName: found.supplierName,
                period:       found.period,
                priceUSD:     parseFloat(priceUSD.toFixed(2)),
                priceDisp:    isARS ? '$ ' + Math.round(found.item.price).toLocaleString('es-AR') : 'USD ' + Math.round(priceUSD)
            });
        });
    });

    if (matches.length === 0) {
        toast('ℹ️ No se encontraron coincidencias con listas de precios de proveedores');
        return;
    }

    showSupMatchModal(presupId, matches, skipped);
}

function showSupMatchModal(presupId, matches, skipped) {
    window._supMatch = { presupId, matches };

    // Group by supplier
    const bySupp = {};
    matches.forEach(m => {
        if (!bySupp[m.supplierId]) bySupp[m.supplierId] = { name: m.supplierName, items: [] };
        bySupp[m.supplierId].items.push(m);
    });

    const suppBlocks = Object.entries(bySupp).map(([sid, grp]) => `
        <div style="margin-bottom:14px">
            <div style="font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
                        color:#6d28d9;padding:6px 0 4px;border-bottom:1.5px solid #ede9fe;margin-bottom:6px">
                🏢 ${esc(grp.name)}
            </div>
            ${grp.items.map(it => `
            <div style="display:flex;align-items:center;gap:8px;padding:6px 2px;border-bottom:1px solid #f5f5f5"
                 data-match-id="${it.itemId}">
                <input type="checkbox" checked style="flex-shrink:0;width:15px;height:15px;cursor:pointer"
                       id="sm-chk-${it.itemId}">
                <div style="flex:1;min-width:0">
                    <div style="font-size:13px;font-weight:500;color:#222;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
                         title="${esc(it.itemDesc)}">${esc(it.itemDesc)}</div>
                    <div style="font-size:11px;color:#888;margin-top:1px">${esc(it.modName)}</div>
                </div>
                <div style="text-align:right;flex-shrink:0">
                    <div style="font-size:13px;font-weight:700;color:#059669">${it.priceDisp}</div>
                    ${it.currentUSD > 0
                        ? `<div style="font-size:11px;color:#aaa;text-decoration:line-through">ant. ${fUSD(it.currentUSD)}</div>`
                        : `<div style="font-size:11px;color:#aaa">sin precio previo</div>`}
                </div>
            </div>`).join('')}
        </div>`).join('');

    const skippedNote = skipped > 0
        ? `<div style="font-size:12px;color:#aaa;text-align:center;margin-top:8px">${skipped} ítem${skipped!==1?'s':''} sin coincidencia en listas de precios</div>`
        : '';

    const ol = document.createElement('div');
    ol.id = 'sup-match-overlay';
    ol.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box';
    ol.innerHTML = `
    <div style="background:#fff;border-radius:14px;width:100%;max-width:560px;max-height:88vh;
                display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.28)">
        <div style="padding:20px 24px 14px;border-bottom:1px solid #ebebeb">
            <div style="font-size:17px;font-weight:700;color:#111">🔍 Coincidencias con proveedores</div>
            <div style="font-size:13px;color:#888;margin-top:3px">${matches.length} ítem${matches.length!==1?'s':''} encontrado${matches.length!==1?'s':''} · Destildá los que no querés aplicar</div>
        </div>
        <div style="overflow-y:auto;flex:1;padding:14px 24px">${suppBlocks}${skippedNote}</div>
        <div style="padding:14px 24px;border-top:1px solid #ebebeb;display:flex;gap:10px;justify-content:flex-end">
            <button class="btn btn-secondary" onclick="document.getElementById('sup-match-overlay').remove()">Cancelar</button>
            <button class="btn btn-primary"   onclick="applySupMatch()" style="background:#6d28d9;border-color:#6d28d9">✅ Aplicar precios</button>
        </div>
    </div>`;
    document.body.appendChild(ol);
    ol.addEventListener('click', e => { if (e.target === ol) ol.remove(); });
}

function applySupMatch() {
    const { presupId, matches } = window._supMatch || {};
    if (!presupId || !matches) return;

    const p = plist.find(x => x.id === presupId);
    if (!p) return;

    let applied = 0;

    matches.forEach(mt => {
        const chk = document.getElementById('sm-chk-' + mt.itemId);
        if (chk && !chk.checked) return;

        const mod = (p.modules||[]).find(m => m.id === mt.modId);
        if (!mod) return;
        const it = (mod.items||[]).find(i => i.id === mt.itemId);
        if (!it) return;

        it.priceMat      = mt.priceUSD;
        it.supplierId    = mt.supplierId;
        it.sourcePeriod  = mt.period;
        applied++;
    });

    if (applied === 0) { toast('ℹ️ Ningún ítem seleccionado'); return; }

    // Recalculate all module subs
    (p.modules||[]).forEach(m => {
        m.sub = (m.items||[]).reduce((s, it) => s + (parseFloat(it.qty)||0) * ((parseFloat(it.priceMat??it.priceUSD??0)||0)+(parseFloat(it.priceMO)||0)), 0);
    });
    _recalcPresupTotals(plist.indexOf(p));
    saveDB();

    document.getElementById('sup-match-overlay')?.remove();
    window._supMatch = null;

    toast('✅ ' + applied + ' precio' + (applied!==1?'s':'') + ' actualizados desde proveedores');
    nav('detalle', presupId);
}

// ── Bloque 3: Exportar Licitación Final ──────────────────────────

async function exportLicitacionFinal(presupId) {
    const p = plist.find(x => x.id === presupId);
    if (!p?.licitacion?.fileData) { toast('❌ No hay licitación original adjunta'); return; }

    toast('⏳ Generando licitación con precios MZ…');

    try {
        // Lazy-load ExcelJS
        if (!window.ExcelJS) {
            await new Promise((res, rej) => {
                const sc = document.createElement('script');
                sc.src = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
                sc.onload = res; sc.onerror = rej;
                document.head.appendChild(sc);
            });
        }

        const lic  = p.licitacion;
        const tc   = p.usdArs || cfg.usdArs || 1450;
        const isARS = (p.moneda || 'USD') === 'ARS';

        // Decode base64 → ArrayBuffer
        const bin   = atob(lic.fileData);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

        const wb = new ExcelJS.Workbook();
        await wb.xlsx.load(bytes.buffer);
        const ws = wb.getWorksheet(lic.sheetName) || wb.worksheets[0];

        const priceCol = lic.cols.price;

        // Write prices back to original rows
        const priceMOCol = lic.cols.priceMO || null;
        (p.modules||[]).forEach(m => {
            (m.items||[]).forEach(it => {
                if (!it.licitRow) return;
                const pm  = parseFloat(it.priceMat??it.priceUSD??0)||0;
                const pmo = parseFloat(it.priceMO)||0;
                const rawPrice = isARS
                    ? pm * tc        // ARS file → write ARS
                    : pm;            // USD file → write USD
                if (rawPrice <= 0 && pmo <= 0) return;
                // Write priceMO column if detected
                if (priceMOCol) {
                    const rawMO = isARS ? pmo * tc : pmo;
                    const cellMO = ws.getRow(it.licitRow).getCell(priceMOCol);
                    if (rawMO > 0) cellMO.value = parseFloat(rawMO.toFixed(2));
                }
                const cell = ws.getRow(it.licitRow).getCell(priceCol);
                cell.value = parseFloat(rawPrice.toFixed(2));
            });
        });

        const buffer = await wb.xlsx.writeBuffer();
        const blob   = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const url    = URL.createObjectURL(blob);
        const a      = document.createElement('a');
        a.href       = url;
        a.download   = lic.fileName.replace(/\.xlsx$/i, '_MZ.xlsx');
        a.click();
        URL.revokeObjectURL(url);
        toast('✅ Licitación exportada — ' + lic.fileName.replace(/\.xlsx$/i, '_MZ.xlsx'));
    } catch(err) {
        toast('❌ Error al exportar: ' + err.message, 'error');
        console.error(err);
    }
}

    const ses = JSON.parse(localStorage.getItem(SES_DB));
    if (ses?.userId) {
        const u = getUser(ses.userId);
        if (u && u.active !== false) { currentUser = u; }

    seedDemoData();
    seedVillaDelParque();
    render();
    renderTopbarUser();

    if (!currentUser) {

})();
